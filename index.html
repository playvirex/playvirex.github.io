/* s=키, p=앞으로 숙인 각, g·d=밝기, c=살빛. 노년은 작고 굽고 핏기가 없다 */
const BODYTUNE=[{s:1,p:0,g:1,d:1,c:0xbfe4ff},
                {s:0.965,p:0,g:1,d:1,c:0xc6e2ff},
                {s:1,p:0,g:1,d:1,c:0xbfe4ff},
                {s:0.935,p:0.075,g:0.86,d:0.88,c:0xd2dbe6}];

/* 평면 스프라이트 — 정점에서 그림을 읽지 않는다(드라이버마다 달라서 깨졌다) */
const RELIEF_V=`
varying vec2 vUv; varying vec3 vN; varying vec3 vP;
void main(){
  vUv=uv;
  vN=normalize(normalMatrix*vec3(0.0,0.0,1.0));
  vec4 mv=modelViewMatrix*vec4(position,1.0);
  vP=mv.xyz;
  gl_Position=projectionMatrix*mv;
}`;

const RELIEF_F=`
uniform sampler2D uMap; uniform vec3 uTint; uniform float uGain; uniform float uDim; uniform float uRim;
varying vec2 vUv; varying vec3 vN; varying vec3 vP;
void main(){
  vec4 t=texture2D(uMap,vUv);
  if(t.a<0.04) discard;
  float lum=max(max(t.r,t.g),t.b);
  vec3 col=t.rgb*uTint*uGain*(0.85+lum*0.7) + uTint*uRim*lum*0.35;
  gl_FragColor=vec4(col, t.a*uDim);
}`;

function reliefMat(T,tex,depth,side,tint,gain,rim){
  return new T.ShaderMaterial({
    uniforms:{uMap:{value:tex},
      uTint:{value:new T.Color(tint)},uGain:{value:gain},uDim:{value:1},uRim:{value:rim}},
    vertexShader:RELIEF_V,fragmentShader:RELIEF_F,
    transparent:true,depthWrite:false,depthTest:true,side:T.DoubleSide});
}

/* 그림 한 장 → 앞뒤로 솟은 두 겹의 덩어리 */
function reliefMesh(T,tex,w,h,depth,tint,gain,rim,seg){
  const grp=new T.Group();
  grp.add(new T.Mesh(new T.PlaneGeometry(w,h,1,1),reliefMat(T,tex,depth,1,tint,gain,rim)));
  return grp;
}

/* 모델 파일이 있으면 그림 대신 진짜 3D 메시를 쓴다.
   assets/model/<기관id>.glb 를 올리면 자동으로 잡는다. */
const MODELS=['liver','alv','blood','bron','cns','gut','phar','nasal'];
const EXTRA={gut:'gut2'};   // 한 칸에 모델이 둘인 경우(위 + 창자)      // 여기에 기관 id를 넣으면 assets/model/<id>.glb 를 쓴다
let _gltf=null;
function loadGLB(T,url,onOk){
  const go=()=>_gltf.load(url,g=>onOk(g.scene),undefined,e=>console.warn('glb',url,e));
  if(_gltf)return go();
  Promise.all([import('./GLTFLoader.js'),import('./DRACOLoader.js')]).then(([L,D])=>{
    const dl=new D.DRACOLoader();dl.setDecoderPath('./draco/');
    _gltf=new L.GLTFLoader();_gltf.setDRACOLoader(dl);go();
  }).catch(e=>console.warn('loader',e));
}

/* 투시 재질: 앞뒤를 모두 반투명으로 그려 속이 비친다 */
const XRAY_V=`varying vec3 vN; varying vec3 vP; varying vec2 vUv; varying vec3 vObj;
void main(){ vUv=uv; vObj=position; vN=normalize(normalMatrix*normal);
 vec4 mv=modelViewMatrix*vec4(position,1.0); vP=mv.xyz;
 gl_Position=projectionMatrix*mv; }`;
const XRAY_F=`uniform sampler2D uMap; uniform float uHasMap;
uniform sampler2D uArt; uniform float uHasArt; uniform vec3 uBBMin; uniform vec3 uBBSize;
uniform vec3 uTint; uniform float uGain; uniform float uDim; uniform float uRim;
varying vec3 vN; varying vec3 vP; varying vec2 vUv; varying vec3 vObj;
void main(){
  vec3 N=normalize(vN), V=normalize(-vP);
  float f=abs(dot(N,V));
  vec3 base = uHasMap>0.5 ? texture2D(uMap,vUv).rgb : vec3(0.35,0.9,0.78);
  if(uHasArt>0.5){
    // 사장님 그림을 정면에서 비춰 모델 표면에 입힌다 — 혈관과 질감이 살아난다
    vec2 pu=(vObj.xy-uBBMin.xy)/max(vec2(0.0001),uBBSize.xy);
    pu=clamp(pu,0.0,1.0); pu.y=1.0-pu.y;
    vec4 a=texture2D(uArt,pu);
    float lum=max(max(a.r,a.g),a.b)*a.a;
    base=mix(base*0.6, a.rgb*0.95, clamp(lum*1.3,0.0,0.80));
  }
  float rim=pow(1.0-f,2.0)*uRim;
  float a2=(0.17+rim*0.70)*uDim;
  vec3 col=base*uTint*uGain*(0.75+rim*1.15);
  gl_FragColor=vec4(col, clamp(a2,0.0,0.95));
}`;
function xrayMat(T,map,tint,gain,rim,side,art,bbMin,bbSize){
  return new T.ShaderMaterial({
    uniforms:{uMap:{value:map||null},uHasMap:{value:map?1:0},
      uArt:{value:art||null},uHasArt:{value:art?1:0},
      uBBMin:{value:bbMin||new T.Vector3()},uBBSize:{value:bbSize||new T.Vector3(1,1,1)},
      uTint:{value:new T.Color(tint)},uGain:{value:gain},uDim:{value:1},uRim:{value:rim}},
    vertexShader:XRAY_V,fragmentShader:XRAY_F,
    transparent:true,depthWrite:false,blending:T.NormalBlending,side:side});
}
/* 모델 하나를 뒷면→앞면 두 번 그려 겹쳐 보이게 한다 */
function xrayify(T,root,tint,art){
  const out=new T.Group();
  // 모든 조각을 한 좌표계로 모아 그림을 비출 기준을 만든다
  const geos=[];
  root.traverse(o=>{if(o.isMesh){const g2=o.geometry.clone();g2.applyMatrix4(o.matrixWorld);geos.push({g:g2,map:null})}});
  const bb=new T.Box3();
  geos.forEach(({g:g2})=>{g2.computeBoundingBox();bb.union(g2.boundingBox)});
  const mn=bb.min.clone(), sz=new T.Vector3();bb.getSize(sz);
  geos.forEach(({g:g2,map})=>{
    [T.BackSide,T.FrontSide].forEach(side=>{
      out.add(new T.Mesh(g2,xrayMat(T,map,tint,1.0,side===T.FrontSide?1.5:0.9,side,art,mn,sz)));
    });
  });
  return out;
}

/* ═══ 관으로 만든 장기 ═══
   창자·기관지·폐처럼 가늘고 갈라지는 구조는 AI가 뒷면을 못 만든다.
   실제 해부 구조가 규칙적이므로 곡선을 따라 관을 둘러 직접 만든다. */
function tubeAlong(T,pts,r0,r1,seg,rad){
  const curve=new T.CatmullRomCurve3(pts.map(p=>new T.Vector3(p[0],p[1],p[2])));
  const g=new T.TubeGeometry(curve,seg||80,r0,rad||10,false);
  if(r1!==undefined&&r1!==r0){            // 끝으로 갈수록 가늘게
    const pos=g.attributes.position, N=(seg||80)+1, ring=(rad||10)+1;
    for(let i=0;i<N;i++){
      const t=i/(N-1), k=(r0+(r1-r0)*t)/r0;
      const c=curve.getPointAt(Math.min(1,t));
      for(let j=0;j<ring;j++){
        const idx=i*ring+j;
        const x=pos.getX(idx),y=pos.getY(idx),z=pos.getZ(idx);
        pos.setXYZ(idx, c.x+(x-c.x)*k, c.y+(y-c.y)*k, c.z+(z-c.z)*k);
      }
    }
    g.computeVertexNormals();
  }
  return g;
}
function merge(T,list){
  // 간단 병합: position/normal/uv 만 이어붙인다
  let vc=0,ic=0;
  list.forEach(g=>{vc+=g.attributes.position.count; ic+=g.index?g.index.count:0});
  const pos=new Float32Array(vc*3),nor=new Float32Array(vc*3),uv=new Float32Array(vc*2);
  const idx=new Uint32Array(ic);
  let vo=0,io=0;
  list.forEach(g=>{
    const p=g.attributes.position,n=g.attributes.normal,u=g.attributes.uv;
    for(let i=0;i<p.count;i++){
      pos[(vo+i)*3]=p.getX(i);pos[(vo+i)*3+1]=p.getY(i);pos[(vo+i)*3+2]=p.getZ(i);
      if(n){nor[(vo+i)*3]=n.getX(i);nor[(vo+i)*3+1]=n.getY(i);nor[(vo+i)*3+2]=n.getZ(i)}
      if(u){uv[(vo+i)*2]=u.getX(i);uv[(vo+i)*2+1]=u.getY(i)}
    }
    if(g.index){const gi=g.index;for(let i=0;i<gi.count;i++)idx[io+i]=gi.getX(i)+vo;io+=gi.count}
    vo+=p.count;
  });
  const out=new T.BufferGeometry();
  out.setAttribute('position',new T.BufferAttribute(pos,3));
  out.setAttribute('normal',new T.BufferAttribute(nor,3));
  out.setAttribute('uv',new T.BufferAttribute(uv,2));
  out.setIndex(new T.BufferAttribute(idx,1));
  return out;
}
/* 기관지: 갈라지는 관을 재귀로 */
function bronchiGeom(T,R){
  const parts=[];
  parts.push(tubeAlong(T,[[0,R*1.5,0],[0,R*0.6,0],[0,R*0.1,0]],R*0.17,R*0.15,24,12));
  const grow=(x,y,z,dx,dy,dz,r,depth)=>{
    if(depth>3||r<R*0.02)return;
    const L=R*(0.52-depth*0.07);
    const ex=x+dx*L, ey=y+dy*L, ez=z+dz*L;
    parts.push(tubeAlong(T,[[x,y,z],[(x+ex)/2+dx*L*0.1,(y+ey)/2,(z+ez)/2],[ex,ey,ez]],r,r*0.72,18,10));
    const spread=0.55-depth*0.07;
    [[-1,1],[1,-1]].forEach(([sx,sz],i)=>{
      const nx=dx*Math.cos(spread)+sx*Math.sin(spread)*0.9;
      const nz=dz*Math.cos(spread)+sz*Math.sin(spread)*0.55;
      const ny=dy*0.92-0.18;
      const L2=Math.hypot(nx,ny,nz);
      grow(ex,ey,ez,nx/L2,ny/L2,nz/L2,r*0.72,depth+1);
    });
  };
  grow(0,R*0.1,0,-0.55,-0.82,0.12,R*0.13,0);
  grow(0,R*0.1,0, 0.55,-0.82,-0.12,R*0.13,0);
  return merge(T,parts);
}
/* 위·소장: 위주머니 + 돌돌 말린 소장 + 둘러싼 대장 */
function gutGeom(T,R){
  const parts=[];
  // 위
  const st=new T.SphereGeometry(R*0.40,22,16);
  st.scale(1.15,0.86,0.72);st.translate(-R*0.22,R*0.80,0);
  parts.push(st);
  parts.push(tubeAlong(T,[[-R*0.1,R*1.25,0],[-R*0.18,R*1.0,0],[-R*0.22,R*0.86,0]],R*0.075,R*0.085,16,10));
  // 소장 — 나선으로 접힌 관
  const coil=[];
  for(let i=0;i<=120;i++){
    const t=i/120, a=t*Math.PI*7.2;
    const rr=R*(0.52-t*0.26);
    coil.push([Math.cos(a)*rr*1.06, R*0.30-t*R*0.70+Math.sin(a*1.7)*R*0.05, Math.sin(a)*rr*0.52]);
  }
  parts.push(tubeAlong(T,coil,R*0.088,R*0.072,200,10));
  // 대장 — 바깥을 ㄷ자로 두른다
  parts.push(tubeAlong(T,[
    [R*0.52,-R*0.72,0],[R*0.60,-R*0.1,0],[R*0.56,R*0.42,0],
    [R*0.18,R*0.56,0],[-R*0.30,R*0.50,0],[-R*0.58,R*0.12,0],
    [-R*0.56,-R*0.48,0],[-R*0.30,-R*0.80,0]],R*0.125,R*0.105,110,12));
  return merge(T,parts);
}
/* 폐포: 두 엽 + 그 안을 채우는 기관지 가지 */
function lungGeom(T,R){
  const parts=[];
  [-1,1].forEach(s=>{
    const lobe=new T.SphereGeometry(R*0.52,26,20);
    lobe.scale(0.80,1.18,0.70);
    lobe.translate(s*R*0.50,0,0);
    parts.push(lobe);
  });
  const br=bronchiGeom(T,R*0.86);
  br.translate(0,R*0.22,0);
  parts.push(br);
  return merge(T,parts);
}
/* 비강·인두: 콧구멍에서 목으로 꺾여 내려가는 통로 */
function nasalGeom(T,R){
  const parts=[];
  [-1,1].forEach(s=>{
    parts.push(tubeAlong(T,[
      [s*R*0.28,R*0.92,R*0.52],[s*R*0.26,R*0.72,R*0.30],
      [s*R*0.20,R*0.42,-R*0.02],[s*R*0.10,R*0.05,-R*0.22]],R*0.17,R*0.13,40,12));
  });
  parts.push(tubeAlong(T,[[0,R*0.05,-R*0.22],[0,-R*0.45,-R*0.20],[0,-R*0.95,-R*0.16]],R*0.22,R*0.19,30,14));
  return merge(T,parts);
}
/* 편도·후두: 인두 관 양옆에 편도 두 덩이 */
function pharGeom(T,R){
  const parts=[];
  parts.push(tubeAlong(T,[[0,R*1.0,0],[0,R*0.2,-R*0.05],[0,-R*0.6,0],[0,-R*1.0,R*0.04]],R*0.26,R*0.21,40,14));
  [-1,1].forEach(s=>{
    const t=new T.SphereGeometry(R*0.26,18,14);
    t.scale(0.78,1.25,0.82);t.translate(s*R*0.34,R*0.34,R*0.04);
    parts.push(t);
  });
  const lx=new T.SphereGeometry(R*0.30,18,14);
  lx.scale(0.9,0.8,0.9);lx.translate(0,-R*0.72,0);
  parts.push(lx);
  return merge(T,parts);
}
const BUILT={bron:bronchiGeom,gut:gutGeom,alv:lungGeom,nasal:nasalGeom,phar:pharGeom};

function initGL(T){
  const cv=document.getElementById('gl');if(!cv)return;
  const r=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true,powerPreference:'high-performance'});
  r.setClearColor(0x000000,0);
  if(r.outputColorSpace!==undefined)r.outputColorSpace=T.SRGBColorSpace;
  const sc=new T.Scene();
  const cam=new T.PerspectiveCamera(32,1,1,4000);
  const ld=new T.TextureLoader();
  const load=k=>{const t=ld.load(IMG[k]);if(T.SRGBColorSpace)t.colorSpace=T.SRGBColorSpace;
    t.minFilter=T.LinearFilter;t.magFilter=T.LinearFilter;GL.tex[k]=t;return t};

  /* 숙주의 몸 — 사장님 해부 렌더가 그대로 입체가 된다 */
  const figKey=HOSTFIG[P.hostIdx]||'figure';
  const fh=(YBOT-YTOP)+52, fw=fh*(620/930);
  GL.fig=reliefMesh(T,load(figKey),fw,fh,0,0xcdeeff,1.05,0.42,2);
  GL.fig.position.y=-((YTOP+YBOT)/2-YMID)+4;
  GL.figKey=figKey;
  sc.add(GL.fig);
  /* 몸 모델이 있으면 평면 그림 대신 그것을 쓴다 */
  GL.mountBody=(idx)=>{
    const key=BODYGLB[idx]||'body', tn=BODYTUNE[idx]||BODYTUNE[0];
    if(GL.bodyKey===key+'|'+idx)return;
    const show=xb=>{
      if(GL.body3&&GL.body3!==xb)GL.body3.visible=false;
      xb.visible=true;GL.body3=xb;GL.bodyKey=key+'|'+idx;
      /* 나이는 자세와 빛깔로 읽힌다 — 작아지고, 숙이고, 핏기가 가신다 */
      xb.scale.setScalar(xb.userData.k*tn.s);
      xb.position.y=xb.userData.y0+(1-tn.s)*((YBOT-YTOP)*0.42);
      xb.rotation.x=tn.p;
      xb.traverse(m=>{if(m.isMesh&&m.material.uniforms){
        const u=m.material.uniforms;
        u.uGain.value=0.50*tn.g;u.uRim.value=2.25;u.uDim.value=0.78*tn.d;
        if(u.uTint)u.uTint.value.setHex(tn.c);
      }});
      GL.fig.visible=false;                   // 평면 그림은 숨긴다
    };
    if(GL.bodies[key]){show(GL.bodies[key]);return}
    loadGLB(T,'assets/model/'+key+'.glb',bs=>{
      bs.updateMatrixWorld(true);
      const xb=xrayify(T,bs,0xbfe4ff,null);
      const bb=new T.Box3().setFromObject(xb),bs2=new T.Vector3();bb.getSize(bs2);
      /* 전신 모델에서 머리~골반이 맵의 YTOP~YBOT 과 겹치도록 맞춘다.
         사람은 전체 키의 약 55%가 머리~골반이다. */
      const span=YBOT-YTOP;                      // 342
      const k=(span/0.55)/bs2.y;                 // 전신 높이 = 622
      xb.scale.setScalar(k);
      const ctr=new T.Vector3();bb.getCenter(ctr);
      xb.position.sub(ctr.multiplyScalar(k));
      const half=(bs2.y*k)/2;
      xb.position.y += (span/2+14) - half;       // 정수리를 맵 위쪽에 건다
      xb.userData.k=k; xb.userData.y0=xb.position.y;
      xb.traverse(m=>{if(m.isMesh)m.renderOrder=-1});
      GL.bodies[key]=xb; xb.visible=false; sc.add(xb);
      if((BODYGLB[P.hostIdx]||'body')===key)show(xb);
    });
  };
  GL.mountBody(P.hostIdx);

  /* 장기 — 각각 자기 그림이 솟아오른다 */
  COMPS.forEach(c=>{
    const o=ORG3[c.id];if(!o)return;
    const sz=(ORGSZ[c.id]||2.0)*c.r*2;
    const grp=new T.Group();
    grp.position.set(o[0],-o[1],o[2]);
    grp.userData.id=c.id;
    if(MODELS.indexOf(c.id)<0&&BUILT[c.id]){
      const geo=BUILT[c.id](T,sz*0.5);
      [T.BackSide,T.FrontSide].forEach(side=>{
        const m=new T.Mesh(geo,xrayMat(T,null,0x9cffe6,1.0,side===T.FrontSide?1.5:0.9,side));
        m.userData.id=c.id;grp.add(m);
      });
    }else if(MODELS.indexOf(c.id)>=0){
      loadGLB(T,'assets/model/'+c.id+'.glb',scene=>{
        scene.updateMatrixWorld(true);
        const art=(c.id==='alv')?(GL.tex['org_'+c.id]||load('org_'+c.id)):null;
        const xr=xrayify(T,scene,0x9cffe6,art);
        // 모델을 기관 크기에 맞춘다
        const box=new T.Box3().setFromObject(xr), size=new T.Vector3();box.getSize(size);
        const k=sz/Math.max(size.x,size.y,size.z);
        xr.scale.setScalar(k);
        const ctr=new T.Vector3();box.getCenter(ctr);
        xr.position.sub(ctr.multiplyScalar(k));
        xr.traverse(m=>{if(m.isMesh)m.userData.id=c.id});
        const rot=ORGROT[c.id];
        if(rot){const wrap=new T.Group();wrap.rotation.set(rot[0],rot[1],rot[2]);wrap.add(xr);grp.add(wrap)}
        else grp.add(xr);
      });
      if(EXTRA[c.id]) loadGLB(T,'assets/model/'+EXTRA[c.id]+'.glb',sc2=>{
        sc2.updateMatrixWorld(true);
        const x2=xrayify(T,sc2,0x9cffe6,null);
        const b2=new T.Box3().setFromObject(x2),s2=new T.Vector3();b2.getSize(s2);
        const k2=sz*0.52/Math.max(s2.x,s2.y,s2.z);
        x2.scale.setScalar(k2);
        const c2=new T.Vector3();b2.getCenter(c2);
        x2.position.sub(c2.multiplyScalar(k2));
        x2.position.y+=sz*0.42;          // 위는 창자 위쪽에
        x2.traverse(m=>{if(m.isMesh)m.userData.id=c.id});
        grp.add(x2);
      });
    }else{
      const rm=reliefMesh(T,load('org_'+c.id),sz,sz,sz*0.085,0x9cffe6,1.1,0.8,56);
      rm.children.forEach(m=>m.userData.id=c.id);
      grp.add(rm);
    }
    sc.add(grp);GL.organs[c.id]=grp;

    const sp=new T.Sprite(new T.SpriteMaterial({map:glowTex(T),color:0x3fe0ad,
      transparent:true,blending:T.AdditiveBlending,depthWrite:false,depthTest:false,opacity:0}));
    sp.position.set(o[0],-o[1],o[2]-sz*0.3);
    sc.add(sp);GL.glow[c.id]=sp;
  });

  const N=360,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*540;pos[i*3+1]=(Math.random()-.5)*470;pos[i*3+2]=(Math.random()-.5)*300}
  const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pos,3));
  GL.pts=new T.Points(pg,new T.PointsMaterial({color:0x5fd8bb,size:2.4,sizeAttenuation:true,
    transparent:true,opacity:.3,blending:T.AdditiveBlending,depthWrite:false}));
  sc.add(GL.pts);

  GL.T=T;GL.r=r;GL.sc=sc;GL.cam=cam;GL.ray=new T.Raycaster();GL.ready=true;
  const gc=document.getElementById('gl');if(gc)gc.style.pointerEvents='none';
}

let _gt=null;
function glowTex(T){
  if(_gt)return _gt;
  const c=document.createElement('canvas');c.width=c.height=128;
  const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.42)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  _gt=new T.CanvasTexture(c);return _gt;
}

function glFrame(W,H,now){
  const T=GL.T,cam=GL.cam;
  /* 투시는 앞뒤 두 번 그린다 — 몸이 화면을 꽉 채우면 픽셀값이 두 배로 든다.
     고해상도 화면에서 배율을 1.5로 묶어야 끌 때 프레임이 떨어지지 않는다 */
  GL.r.setPixelRatio(Math.min(W>=1180?1.5:2,devicePixelRatio||1));
  GL.r.setSize(W,H,false);
  cam.aspect=W/H;

  const yaw=B3.user+Math.sin((now-B3.t0)/2400)*0.46;
  const pit=-B3.pitch;
  let band=W<820?0.42:(H<820?0.46:0.60), cy=0;
  /* 가운데가 비는 넓은 화면에서는 발끝까지 다 보여준다.
     기관만 담던 띠 대신 전신 높이에 맞추고, 시선을 몸 한가운데로 내린다. */
  if(W>=1180&&H>=600&&GL.body3){
    const span=YBOT-YTOP, bh=span/0.55;              // 전신 = 622
    /* 정수리는 제목줄 아래에서 시작하고 발끝은 바닥에 닿는다.
       제목줄 높이는 화면이 짧을수록 비중이 커져서, 비율 대신 실제로 잰다 */
    const gl=GL._goal||(GL._goal=document.querySelector('.goal'));
    const hb=gl?gl.getBoundingClientRect().bottom:H*0.14;
    const t0=Math.max(0.14,Math.min(0.24,(hb+26)/H)), t1=Math.min(0.965,t0+0.795);
    band=Math.max(0.42,Math.min(band,span/(bh/(t1-t0))));
    const f2=span/band;                              // 실제로 보이는 세로 높이
    const mid=(span/2+14)-bh/2;                      // 전신의 한가운데
    cy=-(mid+((t0+t1)/2-0.5)*f2)*Math.max(0,Math.min(1,(1.09-B3.z)/0.09));
  }
  const fit=(YBOT-YTOP)/band;
  const d=(fit/2)/Math.tan(cam.fov*Math.PI/360)/B3.z;
  GL.dist=d;
  const fx=B3.fx, fy=-B3.fy-cy;
  cam.position.set(fx+Math.sin(yaw)*Math.cos(pit)*d, fy+Math.sin(pit)*d, Math.cos(yaw)*Math.cos(pit)*d);
  cam.lookAt(fx,fy,0);
  cam.updateProjectionMatrix();

  /* 숙주가 바뀌면 몸 그림도 바뀐다 */
  if(GL.mountBody)GL.mountBody(P.hostIdx);
  const fk=HOSTFIG[P.hostIdx]||'figure';
  if(GL.fig&&fk!==GL.figKey&&IMG[fk]){
    const t=new T.TextureLoader().load(IMG[fk]);
    if(T.SRGBColorSpace)t.colorSpace=T.SRGBColorSpace;
    GL.fig.children.forEach(m=>{m.material.uniforms.uMap.value=t});GL.figKey=fk;
  }
  /* 그림은 카메라를 향하되, 두께는 3D 공간에 그대로 남는다 */
  if(GL.fig&&GL.fig.visible){GL.fig.rotation.y=yaw*0.78;GL.fig.rotation.x=pit*0.35}

  COMPS.forEach(c=>{
    const grp=GL.organs[c.id];if(!grp)return;
    const occ=S.comp[c.id],dm=S.dmg[c.id],op=openC(c.id),t=occ/100;
    grp.rotation.y=yaw*0.70;grp.rotation.x=pit*0.4;
    grp.scale.setScalar(1+t*.16+(sel===c.id?.05:0));
    const cp=cam.position, wp=grp.position;
    const dd=Math.hypot(wp.x-cp.x,wp.y-cp.y,wp.z-cp.z);
    const dim=Math.max(.42,Math.min(1,1.22-(dd-GL.dist+90)/280));
    const isModel=MODELS.indexOf(c.id)>=0;
    grp.traverse(m=>{
      if(!m.isMesh||!m.material||!m.material.uniforms)return;
      const u=m.material.uniforms;
      u.uTint.value.setRGB(
        0.42+(dm/100)*1.35*Math.max(.3,t),
        occ>0?1.0:0.74,
        occ>0?0.94-(dm/100)*0.52:0.72);
      u.uGain.value = (occ>0? 1.0+t*1.4 : (op? .66 : .40)) * (isModel?0.34:1);
      if(u.uRim)u.uRim.value = (m.material.side===GL.T.FrontSide?1.5:0.9)*(occ>0? 1+t*.8 : .7);
      u.uDim.value  = dim*(occ>0?1:(op?.82:.62))*(isModel?0.62:1);
    });
    const g=GL.glow[c.id];
    if(g){g.material.opacity=t*0.5;const sz=c.r*(3.2+t*2.6);g.scale.set(sz,sz,1);
      g.material.color.setRGB(0.3+(dm/100)*1.3*t,0.9,0.72)}
  });
  GL.pts.rotation.y+=0.0004;
  GL.r.render(GL.sc,cam);
}

const _v=[];
function glProject(mx,my,mz,W,H){
  const T=GL.T;
  const v=(_v[0]=_v[0]||new T.Vector3()).set(mx,-my,mz);
  const dz=v.distanceTo(GL.cam.position);
  v.project(GL.cam);
  return [(v.x*.5+.5)*W, (-v.y*.5+.5)*H, GL.dist/Math.max(1,dz), dz-GL.dist];
}

function glPick(px,py,W,H){
  if(!GL.ready)return null;
  const T=GL.T;
  GL.ray.setFromCamera(new T.Vector2((px/W)*2-1, -(py/H)*2+1), GL.cam);
  const objs=[];COMPS.forEach(c=>{const g=GL.organs[c.id];if(g)g.traverse(m=>{if(m.isMesh)objs.push(m)})});
  const hits=GL.ray.intersectObjects(objs,false);
  if(hits.length){
    const open=hits.find(h=>openC(h.object.userData.id));
    return (open||hits[0]).object.userData.id;
  }
  return null;
}

/* ═══ 3D 인체 맵: 회전하는 단층 와이어프레임 + 3차원에 박힌 장기 ═══
   외부 라이브러리 없음. 링(횡단면)을 쌓아 몸통을 만들고 Y·X축 회전 후 원근 투영한다. */
/* userT/pitchT 는 손가락이 끌고 간 자리, user/pitch 는 몸이 따라오는 자리.
   포인터 이벤트는 프레임과 박자가 안 맞아서, 그대로 쓰면 돌릴 때 덜컥거린다. */
const B3={user:0,userT:0,pitch:-0.10,pitchT:-0.10,drag:false,moved:0,lx:0,ly:0,on:true,t0:Date.now(),
  fx:0,fy:0,z:1,pulse:0,focus:false};
const CAM3=880;
/* 끌어서 침투: 맵 자체가 입력 장치 */
const DRAG={on:false,from:null,x:0,y:0,target:null};

/* 몸통 횡단면 프로필: [y, 좌우 반경, 앞뒤 반경] — y는 기존 맵 좌표(14 정수리 ~ 400 발) */
const PROF=[[14,8,7],[26,20,19],[40,26,25],[56,25,24],[70,17,16],[84,12.5,12],
 [98,14,13],[112,42,21],[124,52,24],[150,50,25],[180,48,26],[210,46,26],
 [240,42,24],[265,40,23],[290,43,24],[312,46,25],[330,44,24],[344,38,21],[352,28,16]];
/* 팔: [중심 x, 중심 z, y위, y아래, 반경위, 반경아래] — 다리는 화면 밖이라 생략 */
const LIMB=[[-64,0,126,214,11,9],[64,0,126,214,11,9],
 [-70,3,214,290,9,7.5],[70,3,214,290,9,7.5]];
const YTOP=14,YBOT=356,YMID=(YTOP+YBOT)/2;
const SEG=26;                                   // 링 분할 수

/* 장기의 3차원 위치: [좌우, 상하(207 기준), 앞뒤(+가 앞)] */
const ORGSZ={nasal:1.5,phar:1.8,bron:1.5,alv:1.22,blood:1.25,gut:1.55,liver:1.7,cns:0.86};
const ORG3={cns:[0,-157,-16],nasal:[2,-112,16],phar:[0,-82,6],bron:[0,-50,-2],
 alv:[0,-6,4],blood:[-4,26,-16],liver:[24,82,14],gut:[-8,122,16]};

function rot3(x,y,z){
  const ya=B3.user+Math.sin((Date.now()-B3.t0)/2400)*0.46;   // 가만히 둬도 천천히 흔들린다
  const cy=Math.cos(ya),sy=Math.sin(ya);
  const X=x*cy+z*sy, Z1=-x*sy+z*cy;
  const cp=Math.cos(B3.pitch),sp=Math.sin(B3.pitch);
  return [X, y*cp-Z1*sp, y*sp+Z1*cp];
}
let C3=[0,0],S3=1;
function P3(mx,my,mz){
  if(GL.ready)return glProject(mx,my,mz,W,H);
  const r=rot3(mx,my,mz), k=CAM3/(CAM3+r[2]);
  return [C3[0]+r[0]*k*S3, C3[1]+r[1]*k*S3, k, r[2]];
}
/* 링 한 개의 꼭짓점 */
function ringPts(cx,cz,y,rx,rz){
  const o=[];
  for(let i=0;i<SEG;i++){const a=i/SEG*Math.PI*2;
    o.push(P3(cx+Math.cos(a)*rx, y-YMID, cz+Math.sin(a)*rz));}
  return o;
}
/* 몸통 + 사지의 링 모음 */
function shellRings(){
  const R=[];
  for(let i=0;i<PROF.length;i++){const[y,rx,rz]=PROF[i];R.push({y,pts:ringPts(0,0,y,rx,rz)})}
  LIMB.forEach(L=>{const[lx,lz,y0,y1,r0,r1]=L;
    for(let k=0;k<=3;k++){const f=k/3,y=y0+(y1-y0)*f,r=r0+(r1-r0)*f;
      R.push({y,limb:1,pts:ringPts(lx,lz,y,r,r)})}});
  return R;
}
/* 깊이 → 밝기 */
const dAlpha=z=>{const k=(1-(z+160)/340);return Math.max(.06,Math.min(1,.12+k*.9))};

/* ═══ 면역세포: 숙주가 반격하는 모습을 보여준다 ═══
   대식세포 = 선천면역 · 호중구 NET = 염증(손상) · T세포 = 적응면역 */
let IMM3=[];
function seedImm(){
  IMM3=[];
  const add=(kind,o,n,rr)=>{for(let i=0;i<n;i++){
    const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1),d=rr*(.75+Math.random()*.75);
    IMM3.push({kind,base:o,x:o[0]+Math.sin(b)*Math.cos(a)*d,y:o[1]+Math.cos(b)*d*.7,
      z:o[2]+Math.sin(b)*Math.sin(a)*d,ph:Math.random()*6.283,sp:(Math.random()-.5)*.008,
      bob:Math.random()*6.283,sz:.85+Math.random()*.4});
  }};
  COMPS.forEach(c=>{
    const o=ORG3[c.id];if(!o)return;
    const occ=S.comp[c.id],dm=S.dmg[c.id],rr=c.r*1.25;
    if(occ<=0)return;
    const mac=Math.min(3,Math.floor(S.innate/14));
    const net=dm>30?Math.min(2,Math.floor((dm-30)/26)+1):0;
    const tc =S.adaptive>6?Math.min(3,Math.floor(S.adaptive/13)):0;
    if(mac)add('imac',o,mac,rr);
    if(net)add('inet',o,net,rr);
    if(tc) add('itc', o,tc, rr);
  });
}

let parts3=[];
function seedParts3(){
  parts3=[];seedImm();
  COMPS.forEach(c=>{const o=ORG3[c.id];if(!o)return;
    const n=Math.min(9,Math.round(S.comp[c.id]/11)), rr=c.r*0.85;
    for(let i=0;i<n;i++){
      const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1),d=rr*(.35+Math.random()*.65);
      parts3.push({id:c.id,x:o[0]+Math.sin(b)*Math.cos(a)*d,y:o[1]+Math.cos(b)*d,z:o[2]+Math.sin(b)*Math.sin(a)*d,
        sp:(Math.random()-.5)*.012,ph:Math.random()*6.283,rr:d,base:[o[0],o[1],o[2]]});
    }});
}

function drawBody3(){
  cx.clearRect(0,0,W,H);
  /* 카메라: 고른 기관 쪽으로 밀려들어간다 */
  const o0=B3.focus?ORG3[sel]:null;
  const tfx=o0? -o0[0]*0.40 : 0, tfy=o0? -o0[1]*0.16 : 0, tz=o0? 1.09 : 1;
  B3.fx+=(tfx-B3.fx)*.055; B3.fy+=(tfy-B3.fy)*.055; B3.z+=(tz-B3.z)*.05;
  /* 손가락을 쫓아가되 한 박자 늦게 — 그 지연이 매끄러움이다.
     프레임이 느려도 같은 속도로 따라붙도록 실제 흐른 시간으로 센다 */
  const dt=Math.min(120,Date.now()-(B3.lt||Date.now()));B3.lt=Date.now();
  const e=1-Math.pow(1-0.22,dt/16.7);
  B3.user +=(B3.userT -B3.user )*e;
  B3.pitch+=(B3.pitchT-B3.pitch)*e;
  if(B3.pulse>0)B3.pulse-=0.045;
  const kick=1+Math.max(0,B3.pulse)*0.10;
  const band=W<820?0.42:(H<820?0.46:0.60);   // 남는 세로 공간에 맞춘다
  S3=Math.min(W/(W>=820?330:175),(H*band)/(YBOT-YTOP))*B3.z*kick;
  C3=[W/2+B3.fx*S3, H*(W>=820&&H<820?0.53:0.49)+B3.fy*S3];
  hit=[];
  const now=Date.now();

  if(GL.ready){ try{ glFrame(W,H,now) }catch(e){ GL.ready=false } }

  /* ── 배경: 조직 깊이, 천천히 흐른다 ── */
  if(!GL.ready){
  const bgi=imgs.bgtissue;
  if(bgi&&bgi.complete&&bgi.naturalWidth){
    const ar=bgi.naturalWidth/bgi.naturalHeight, sc=Math.max(W/bgi.naturalWidth,H/bgi.naturalHeight)*1.22;
    const bw=bgi.naturalWidth*sc, bh=bgi.naturalHeight*sc;
    const dx=W/2-bw/2 - Math.sin((now-B3.t0)/9000)*26 - B3.user*34;
    const dy=H/2-bh/2 - Math.sin((now-B3.t0)/13000)*16;
    cx.globalAlpha=.62;cx.drawImage(bgi,dx,dy,bw,bh);cx.globalAlpha=1;
  }

  /* ── 숙주의 몸: 실제 해부 렌더 ── */
  const fig=imgs[HOSTFIG[P.hostIdx]||'figure'];
  const yaw=B3.user+Math.sin((now-B3.t0)/2400)*0.46;
  if(fig&&fig.complete&&fig.naturalWidth){
    const top=P3(0,YTOP-YMID-10,0), bot=P3(0,YBOT-YMID+34,0);
    const fh=Math.abs(bot[1]-top[1]);
    const fw=fh*(fig.naturalWidth/fig.naturalHeight)*Math.max(.13,Math.abs(Math.cos(yaw)));
    const cxp=(top[0]+bot[0])/2;
    cx.save();
    cx.globalAlpha=.34+Math.abs(Math.cos(yaw))*.18;
    cx.drawImage(fig,cxp-fw/2,Math.min(top[1],bot[1]),fw,fh);
    cx.restore();
  }

  /* ── 단층 스캔선: 몸 위에 아주 옅게 ── */
  const R=shellRings();
  R.forEach(rg=>{
    if(rg.limb)return;
    for(let i=0;i<SEG;i++){
      const a=rg.pts[i],b=rg.pts[(i+1)%SEG];
      const al=dAlpha((a[3]+b[3])/2)*.16;
      cx.strokeStyle='rgba(110,186,162,'+(al*.5).toFixed(3)+')';
      cx.lineWidth=.8;
      cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke();
    }});
  }   /* ← 여기까지 2D 전용 */

  /* ── 장기: 뒤에서 앞으로 ── */
  const order=COMPS.map(c=>{const o=ORG3[c.id];const p=P3(o[0],o[1],o[2]);return{c,p}})
    .sort((a,b)=>b.p[3]-a.p[3]);

  order.forEach(({c,p})=>{
    const occ=S.comp[c.id],dm=S.dmg[c.id];
    const r=c.r*S3*p[2], behind=p[3]>0;
    const fade=behind? .42 : 1;
    const on=occ>0,op=openC(c.id);
    /* 장기 스프라이트 — 동그라미 대신 실제 장기 */
    const oim=GL.ready?null:imgs['org_'+c.id];
    if(oim&&oim.complete&&oim.naturalWidth){
      const sp=(ORGSZ[c.id]||2.4)*r;
      cx.save();
      cx.globalAlpha=(on? .85+Math.min(.15,occ/100*.2) : (op?.42:.24))*fade;
      cx.drawImage(oim,p[0]-sp,p[1]-sp,sp*2,sp*2);
      if(dm>14){ // 손상 조직은 붉게 물든다
        cx.globalCompositeOperation='source-atop';
        cx.globalAlpha=Math.min(.55,dm/100*.75)*fade;
        cx.fillStyle='#e2554a';cx.fillRect(p[0]-sp,p[1]-sp,sp*2,sp*2);
      }
      cx.restore();
    }
    hit.push({id:c.id,p:[p[0],p[1]],r:Math.max(r,24*S3)});
    if(GL.ready){ /* 3D가 장기를 직접 그린다 — 2D는 선택 표시만 */
      if(sel===c.id){cx.beginPath();cx.arc(p[0],p[1],r*.92,0,7);
        cx.strokeStyle='rgba(99,245,195,.9)';cx.lineWidth=2;cx.stroke()}
      if(FLASH.id===c.id&&FLASH.t>0){cx.beginPath();cx.arc(p[0],p[1],r+6+(6-FLASH.t),0,7);
        cx.strokeStyle='rgba(255,255,255,'+(FLASH.t/9)+')';cx.lineWidth=2;cx.stroke()}
      return;
    }
    if(on){
      // 몸 위로 떠오르게 어둡게 깔고 그 위에 발광
      const gd=cx.createRadialGradient(p[0],p[1],0,p[0],p[1],r*1.25);
      gd.addColorStop(0,'rgba(2,8,7,'+(.62*fade)+')');gd.addColorStop(1,'rgba(2,8,7,0)');
      cx.fillStyle=gd;cx.beginPath();cx.arc(p[0],p[1],r*1.25,0,7);cx.fill();
      const gr=cx.createRadialGradient(p[0],p[1],0,p[0],p[1],r);
      gr.addColorStop(0,'rgba(63,224,173,'+((.18+occ/100*.52)*fade)+')');
      gr.addColorStop(1,'rgba(63,224,173,0)');
      cx.fillStyle=gr;cx.beginPath();cx.arc(p[0],p[1],r,0,7);cx.fill();
      if(dm>25){const g2=cx.createRadialGradient(p[0],p[1],0,p[0],p[1],r);
        g2.addColorStop(0,'rgba(226,85,74,'+(dm/100*.44*fade)+')');g2.addColorStop(1,'rgba(226,85,74,0)');
        cx.fillStyle=g2;cx.beginPath();cx.arc(p[0],p[1],r,0,7);cx.fill()}
    }
    if(!on){   // 아직 없는 곳도 장기로 보이게 — 옅은 덩어리
      if(!(oim&&oim.complete&&oim.naturalWidth)){
        const g3=cx.createRadialGradient(p[0],p[1],0,p[0],p[1],r*.8);
        g3.addColorStop(0,(op?'rgba(168,198,188,':'rgba(118,140,130,')+(.40*fade)+')');
        g3.addColorStop(1,'rgba(96,114,106,0)');
        cx.fillStyle=g3;cx.beginPath();cx.arc(p[0],p[1],r*.8,0,7);cx.fill();}
    }else{
      // 점유율 = 둘레를 채우는 호. 숫자를 안 봐도 읽힌다
      const a0=-Math.PI/2, a1=a0+(occ/100)*Math.PI*2;
      cx.beginPath();cx.arc(p[0],p[1],r*.80,0,7);
      cx.strokeStyle='rgba(63,224,173,'+(.14*fade)+')';cx.lineWidth=Math.max(2,r*.10);cx.stroke();
      cx.beginPath();cx.arc(p[0],p[1],r*.80,a0,a1);
      cx.strokeStyle='rgba(99,245,195,'+(.92*fade)+')';cx.lineWidth=Math.max(2,r*.10);
      cx.lineCap='round';cx.stroke();cx.lineCap='butt';
      if(dm>12){ // 손상 = 바깥쪽 붉은 호
        const b1=a0+(dm/100)*Math.PI*2;
        cx.beginPath();cx.arc(p[0],p[1],r*.97,a0,b1);
        cx.strokeStyle='rgba(226,85,74,'+(.80*fade)+')';cx.lineWidth=Math.max(1.5,r*.06);cx.stroke();
      }
    }
    cx.beginPath();cx.arc(p[0],p[1],r*.62,0,7);
    cx.strokeStyle=sel===c.id?'rgba(63,224,173,'+(0.4+0.6*fade)+')'
      :(on?'rgba(63,224,173,'+(.85*fade)+')':(op?'rgba(206,226,218,'+(.95*fade)+')':'rgba(142,164,154,'+(.8*fade)+')'));
    cx.lineWidth=sel===c.id?3:2;
    cx.setLineDash(on?[]:(op?[4,4]:[2,5]));cx.stroke();cx.setLineDash([]);
    if(FLASH.id===c.id&&FLASH.t>0){cx.beginPath();cx.arc(p[0],p[1],r+6+(6-FLASH.t),0,7);
      cx.strokeStyle='rgba(255,255,255,'+(FLASH.t/9)+')';cx.lineWidth=2;cx.stroke()}
  });

  /* ── 입자 ── */
  if(!GL.ready)parts3.forEach(q=>{
    q.ph+=q.sp;
    const a=q.ph, x=q.base[0]+Math.cos(a)*(q.x-q.base[0])-Math.sin(a)*(q.z-q.base[2]);
    const z=q.base[2]+Math.sin(a)*(q.x-q.base[0])+Math.cos(a)*(q.z-q.base[2]);
    const p=P3(x,q.y,z);
    const al=(p[3]>0?.3:.75);
    const s=Math.max(1.2,4.4*S3*p[2]);
    if(imgs.virion.complete&&imgs.virion.naturalWidth){
      cx.globalAlpha=al;cx.drawImage(imgs.virion,p[0]-s,p[1]-s,s*2,s*2);cx.globalAlpha=1}
    else{cx.beginPath();cx.arc(p[0],p[1],s,0,7);cx.fillStyle='rgba(63,224,173,'+al+')';cx.fill()}
  });

  /* ── 끌어서 침투: 연결선과 갈 수 있는 곳 ── */
  if(DRAG.on&&DRAG.from){
    const o=ORG3[DRAG.from],ps=P3(o[0],o[1],o[2]);
    const ph=(now%1000)/1000;
    cx.font='600 11px "IBM Plex Sans KR", sans-serif';cx.textAlign='center';
    (ADJ[DRAG.from]||[]).forEach(t=>{
      if(S.comp[t]>0)return;
      const ot=ORG3[t];if(!ot)return;const pt=P3(ot[0],ot[1],ot[2]);
      const rt=Math.max(COMPS.find(c=>c.id===t).r*S3*pt[2],18*S3);
      const ok=openC(t);
      const why=!unlocked(t)?'수용체 없음':(!ok?'점유 20% 필요':'');
      const col=ok?'99,245,195':'150,120,110';
      cx.beginPath();cx.moveTo(ps[0],ps[1]);cx.lineTo(pt[0],pt[1]);
      cx.strokeStyle='rgba('+col+','+(DRAG.target===t?.85:(ok?.22:.14))+')';
      cx.lineWidth=DRAG.target===t?2.4:1.2;cx.setLineDash([6,6]);
      cx.lineDashOffset=-ph*12;cx.stroke();cx.setLineDash([]);
      const k=DRAG.target===t?1:.45;
      cx.beginPath();cx.arc(pt[0],pt[1],rt*(ok?.72+ph*.22:.78),0,7);
      cx.strokeStyle='rgba('+col+','+(ok?(k*(1-ph)*.9+.12):.42)+')';
      cx.lineWidth=ok?2.4:1.6;
      if(!ok)cx.setLineDash([3,4]);
      cx.stroke();cx.setLineDash([]);
      if(why){cx.fillStyle='rgba(190,160,150,.85)';cx.fillText(why,pt[0],pt[1]+rt+13)}
    });
    // 손가락까지 이어지는 선
    cx.beginPath();cx.moveTo(ps[0],ps[1]);cx.lineTo(DRAG.x,DRAG.y);
    cx.strokeStyle=DRAG.target?'rgba(99,245,195,.9)':'rgba(159,179,171,.45)';
    cx.lineWidth=DRAG.target?3:1.6;cx.stroke();
    cx.beginPath();cx.arc(DRAG.x,DRAG.y,DRAG.target?7:4,0,7);
    cx.fillStyle=DRAG.target?'rgba(99,245,195,.9)':'rgba(159,179,171,.5)';cx.fill();
  }

  /* ── 면역세포 ── */
  IMM3.forEach(m=>{
    m.ph+=m.sp;m.bob+=0.016;
    const a=m.ph;
    const x=m.base[0]+Math.cos(a)*(m.x-m.base[0])-Math.sin(a)*(m.z-m.base[2]);
    const z=m.base[2]+Math.sin(a)*(m.x-m.base[0])+Math.cos(a)*(m.z-m.base[2]);
    const p=P3(x,m.y+Math.sin(m.bob)*2.2,z);
    const im=imgs[m.kind];if(!im||!im.complete||!im.naturalWidth)return;
    const s=Math.max(9,(m.kind==='inet'?30:23)*m.sz*S3*p[2]);
    cx.globalAlpha=(p[3]>0?.3:.8)*(m.kind==='inet'?.75:1);
    cx.drawImage(im,p[0]-s,p[1]-s,s*2,s*2);cx.globalAlpha=1;
  });

  /* ── 라벨: 화면 좌표로 ── */
  const lab=order.slice().sort((a,b)=>a.p[1]-b.p[1]);
  const used=[];
  lab.forEach(({c,p})=>{
    const occ=S.comp[c.id],on=occ>0,op=openC(c.id);
    const tgt=TUT.on&&TUT.steps[TUT.i]&&TUT.steps[TUT.i].point==='comp:'+c.id;
    const r=Math.max(c.r*S3*p[2],18*S3);
    const h0=hit.find(h=>h.id===c.id);
    if(!(on||sel===c.id||tgt)){
      cx.beginPath();cx.arc(p[0]+(LABR.indexOf(c.id)>=0?r+9:-r-9),p[1],2.6,0,7);
      cx.fillStyle=op?'rgba(159,179,171,.8)':'rgba(90,108,100,.7)';cx.fill();
      if(h0)h0.lab={x:p[0]-r-16,y:p[1]-12,w:r*2+32,h:24};
      return;
    }
    const right=LABR.indexOf(c.id)>=0;
    const txt=c.nm+'  '+(on?Math.round(occ)+'%':(op?'침투 가능':'잠김'));
    cx.font='600 12.5px "IBM Plex Mono", monospace';
    const tw=cx.measureText(txt).width;
    let ly=p[1];
    while(used.some(u=>Math.abs(u-ly)<17))ly+=17;     // 라벨 겹침 방지
    used.push(ly);
    const edge=right?p[0]+r+8:p[0]-r-8;
    const lx=right?Math.min(edge,W-tw-6):Math.max(edge,tw+6);
    cx.strokeStyle=on?'rgba(63,224,173,.42)':'rgba(120,138,130,.28)';cx.lineWidth=1;
    cx.beginPath();cx.moveTo(right?p[0]+r:p[0]-r,p[1]);cx.lineTo(lx+(right?-4:4),ly);cx.stroke();
    cx.textAlign=right?'left':'right';
    cx.fillStyle=on?'#e4efe9':(op?'#9fb3ab':'#5a6c64');
    cx.fillText(txt,lx,ly+4.5);
    if(h0)h0.lab={x:right?lx-6:lx-tw-6,y:ly-13,w:tw+12,h:26};
  });
  if(FLASH.t>0)FLASH.t--;

  /* ── 튜토리얼 포인터 ── */
  const st=TUT.on?TUT.steps[TUT.i]:null;
  if(st&&st.point&&st.point.indexOf('comp:')===0){
    const tc=COMPS.find(c=>c.id===st.point.slice(5));
    if(tc){const o=ORG3[tc.id],p=P3(o[0],o[1],o[2]),rr=tc.r*S3*p[2];
      const ph=(now%1200)/1200, a=.35+.45*Math.abs(Math.sin(ph*Math.PI));
      cx.beginPath();cx.arc(p[0],p[1],rr+8+ph*10,0,7);
      cx.strokeStyle='rgba(63,224,173,'+(a*(1-ph))+')';cx.lineWidth=3;cx.stroke();
      cx.beginPath();cx.arc(p[0],p[1],rr+5,0,7);
      cx.strokeStyle='rgba(255,255,255,'+a+')';cx.lineWidth=2;cx.stroke();
      const ay=p[1]-rr-14-Math.sin(ph*6.283)*4;
      cx.beginPath();cx.moveTo(p[0],ay+9);cx.lineTo(p[0]-6,ay);cx.lineTo(p[0]+6,ay);cx.closePath();
      cx.fillStyle='rgba(63,224,173,'+(.6+a*.4)+')';cx.fill();
      cx.font='600 12px "IBM Plex Sans KR", sans-serif';cx.textAlign='center';
      cx.fillStyle='rgba(63,224,173,'+(.7+a*.3)+')';cx.fillText('여기',p[0],ay-5);
    }
  }
  /* 면역 범례 — 무엇이 떠다니는지 알려준다 */
  const kinds=[];
  if(IMM3.some(m=>m.kind==='imac'))kinds.push(['imac','대식세포']);
  if(IMM3.some(m=>m.kind==='inet'))kinds.push(['inet','호중구 NET']);
  if(IMM3.some(m=>m.kind==='itc'))kinds.push(['itc','T세포']);
  if(kinds.length){
    cx.font='500 10px "IBM Plex Sans KR", sans-serif';cx.textAlign='left';
    let yy=H*0.58-(kinds.length-1)*7.5;
    kinds.forEach(([k,nm])=>{
      const im=imgs[k];
      const lx0=Math.max(6,C3[0]-150);
      if(im&&im.complete&&im.naturalWidth)cx.drawImage(im,lx0,yy-7,14,14);
      cx.fillStyle='rgba(159,179,171,.85)';cx.fillText(nm,lx0+17,yy+3.5);yy+=15;
    });
  }
  /* 회전 안내 — 아직 한 번도 안 돌려봤으면 */
  if(!B3.moved||!B3.dragged){
    const ph=(now%2400)/2400, a=.30+.3*Math.abs(Math.sin(ph*Math.PI));
    cx.font='600 11px "IBM Plex Sans KR", sans-serif';cx.textAlign='center';
    cx.fillStyle='rgba(159,179,171,'+a+')';
    cx.fillText(COMPS.some(c=>S.comp[c.id]>0)?'감염된 기관을 끌어서 옆 기관으로 밀어넣기  ·  빈 곳을 끌면 회전':'⟲  좌우로 끌어 돌려보기',W/2,H-26);
  }
}

/* 맵이 곧 입력 장치: 기관을 끌어 옆 기관으로 침투 · 빈 곳을 끌면 회전 */
(function(){
  let down=false,lx=0,ly=0,mv=0,rot=false;
  const loc=e=>{const r=cv.getBoundingClientRect();
    const sx=(cv.width/DPR)/r.width, sy=(cv.height/DPR)/r.height;
    return [(e.clientX-r.left)*sx,(e.clientY-r.top)*sy]};
  const dn=e=>{
    if(!B3.on)return;
    down=true;mv=0;lx=e.clientX;ly=e.clientY;rot=false;
    const q=loc(e),id=pickAt(q[0],q[1]);
    if(id&&S.comp[id]>0&&!S.over&&S.ap>0){
      DRAG.on=true;DRAG.from=id;DRAG.x=q[0];DRAG.y=q[1];DRAG.target=null;
    }else{rot=true}
    cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  };
  const mvh=e=>{
    if(!down)return;
    const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
    mv+=Math.abs(dx)+Math.abs(dy);
    if(DRAG.on){
      const q=loc(e);DRAG.x=q[0];DRAG.y=q[1];
      const t=pickAt(q[0],q[1]);
      DRAG.target=(t&&t!==DRAG.from&&(ADJ[DRAG.from]||[]).includes(t)&&openC(t)&&S.comp[t]<=0)?t:null;
      e.preventDefault();return;
    }
    if(rot&&mv>6){B3.moved=1;B3.userT+=dx*0.017;
      B3.pitchT=Math.max(-0.5,Math.min(0.35,B3.pitchT+dy*0.006));e.preventDefault()}
  };
  const up=e=>{
    if(!down)return;down=false;
    if(DRAG.on){
      const tgt=DRAG.target,from=DRAG.from;
      DRAG.on=false;DRAG.from=null;DRAG.target=null;
      if(tgt){B3.dragged=1;sel=tgt;B3.pulse=1;act('inv');return}
      const q2=loc(e),blocked=pickAt(q2[0],q2[1]);
      if(blocked&&blocked!==from&&(ADJ[from]||[]).includes(blocked)&&S.comp[blocked]<=0){
        const c2=COMPS.find(c=>c.id===blocked);
        say(c2.nm+' — '+(!unlocked(blocked)?'수용체가 없어 갈 수 없다':'출발 기관 점유율이 20% 이상이어야 한다'),'bad');
        FLASH.id=blocked;FLASH.t=6;render();return}
      if(mv<=6){B3.focus=(from===sel)?!B3.focus:true;sel=from;FLASH.id=from;FLASH.t=6;B3.pulse=1;render();if(TUT.on)tutCheck('tap');return}
      render();return;
    }
    if(mv<=6)onTap(e.clientX,e.clientY);
  };
  cv.addEventListener('pointerdown',dn);
  cv.addEventListener('pointermove',mvh,{passive:false});
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',()=>{down=false;DRAG.on=false;DRAG.from=null;DRAG.target=null});
})();
/* 더블탭·핀치로 화면이 확대된 채 안 돌아오는 것 차단 */
(function(){
  let lastT=0;
  addEventListener('touchend',e=>{const n=Date.now();
    if(n-lastT<340){e.preventDefault()} lastT=n;},{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(k=>
    addEventListener(k,e=>e.preventDefault(),{passive:false}));
  addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
})();
addEventListener('resize',()=>{fitCanvas();seedParts()});
if(window.ResizeObserver){
  let t0=0;
  new ResizeObserver(()=>{const n=Date.now();if(n-t0<80)return;t0=n;fitCanvas();seedParts()})
    .observe(document.getElementById('stage'));

/* ═══ 저장: 브라우저에 그대로 담아 둔다. 서버도 계정도 쓰지 않는다 ═══
   F(형질 효과)는 P.nodes 에서 다시 계산되므로 담지 않는다. */
/* ═══ 관리자 모드 — ?dev=<열쇠> 로만 열린다 ═══
   정적 사이트라 소스를 보면 열쇠가 드러난다. 일반 플레이어를 막는 빗장이지 자물쇠가 아니다. */
/* 시작형: 트리를 대신하지 않는다 — 몇 칸을 미리 찍어 준 상태로 출발할 뿐이다 */
const ARCH={
  resp:{nm:'호흡기형 — 상기도',n:['sia26']},
  deep:{nm:'침습형 — 폐포',n:['ace2']},
  hepa:{nm:'간친화형',n:['ace2','avid','ntcp']},
  neuro:{nm:'신경친화형',n:['avid','cd4','bbb']},
  enter:{nm:'장관형',n:['shed','nonenv']}
};
const DEVKEY='mycoplasma1889';
const DEV=(()=>{try{return new URLSearchParams(location.search).get('dev')===DEVKEY}catch(e){return false}})();
function devPanel(){
  if(!DEV||document.getElementById('devp'))return;
  const d=document.createElement('div');d.id='devp';
  const eras=HOSTS.map((h,i)=>'<option value="'+i+'">'+i+'. '+(ERAS[h.era]||{}).nm+' · '+h.t+'</option>').join('');
  d.innerHTML='<b>DEV</b>'
   +'<label>숙주<select id="dvHost">'+eras+'</select></label>'
   +'<label>활력<input id="dvHp" type="number" min="0" max="200" step="1"></label>'
   +'<label>에너지<input id="dvMp" type="number" min="0" step="10"></label>'
   +'<label>EP<input id="dvEp" type="number" min="0" step="1"></label>'
   +'<label>시작형<select id="dvArch"><option value="">(기본 — 백지)</option>'
   +Object.keys(ARCH).map(k=>'<option value="'+k+'">'+ARCH[k].nm+'</option>').join('')
   +'</select></label>'
   +'<div class="dvr"><button data-a="fill">전 칸 90%</button><button data-a="dmg">전 칸 손상 80</button>'
   +'<button data-a="kill">숙주 즉사</button><button data-a="day">+5일</button>'
   +'<button data-a="unlock">트리 전부 해금</button><button data-a="wipe">저장 삭제</button></div>';
  document.body.appendChild(d);
  const sync=()=>{d.querySelector('#dvHost').value=P.hostIdx;
    d.querySelector('#dvHp').value=Math.round(S.host);
    d.querySelector('#dvMp').value=Math.round(S.mp);
    d.querySelector('#dvEp').value=P.epBase};
  sync();d.dataset.sync='1';
  d.querySelector('#dvHost').onchange=e=>{P.hostIdx=+e.target.value;newHost();F=FX();
    document.getElementById('ev').classList.remove('on');seedParts();render();sync()};
  d.querySelector('#dvHp').onchange=e=>{S.host=+e.target.value;S.maxHost=Math.max(S.maxHost,S.host);render()};
  d.querySelector('#dvMp').onchange=e=>{S.mp=+e.target.value;render()};
  d.querySelector('#dvEp').onchange=e=>{P.epBase=+e.target.value;render()};
  d.querySelector('#dvArch').onchange=e=>{
    const a=ARCH[e.target.value];if(!a)return;
    /* 실제로 존재하고 아직 없는 노드만 얹는다 */
    a.n.forEach(id=>{if(ALLN.some(n=>n.id===id)&&!P.nodes.includes(id))P.nodes.push(id)});
    F=FX();seedParts();render();sync();say(a.nm+' 적용','hi');
  };
  d.querySelector('.dvr').onclick=e=>{
    const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
    if(a==='fill')COMPS.forEach(c=>S.comp[c.id]=90);
    if(a==='dmg')COMPS.forEach(c=>S.dmg[c.id]=80);
    if(a==='kill')S.host=0;
    if(a==='day')S.day+=5;
    if(a==='unlock'){ALLN.forEach(n=>{if(!P.nodes.includes(n.id))P.nodes.push(n.id)});P.epBase+=200;F=FX()}
    if(a==='wipe'){wipeSave();say('저장 삭제됨','bad');return}
    F=FX();seedParts();render();sync();
  };
  /* 숫자가 턴마다 바뀌니 패널도 따라간다 */
  setInterval(()=>{if(document.activeElement&&document.activeElement.closest('#devp'))return;
    try{sync()}catch(e){}},900);
}

const SKEY='virex.save.v2';
function saveGame(){
  try{localStorage.setItem(SKEY,JSON.stringify({v:2,t:Date.now(),P:P,S:S,sel:sel,build:BUILD}))}
  catch(e){}
}
function peekSave(){
  try{const r=JSON.parse(localStorage.getItem(SKEY));
    return (r&&r.v===2&&r.P&&r.S)?r:null}catch(e){return null}
}
function loadGame(){
  const r=peekSave();if(!r)return false;
  try{
    P=r.P;S=r.S;sel=r.sel||'nasal';
    if(!P.nodes)P.nodes=['core'];if(!P.trig)P.trig=[];
    F=FX();fitCanvas();seedParts();render();
    return true;
  }catch(e){return false}
}
function wipeSave(){try{localStorage.removeItem(SKEY)}catch(e){}}

newHost();F=FX();fitCanvas();seedParts();render();loop();
(function(){
  const t=document.getElementById('title');
  let started=false;
  const toGame=()=>{document.getElementById('intro').classList.remove('on');
    fitCanvas();seedParts();render();showBrief();devPanel();};
  /* 이어하기: 인트로와 브리핑을 건너뛰고 저장된 자리에서 바로 집어든다 */
  const resume=()=>{if(started)return;started=true;
    t.classList.add('out');setTimeout(()=>t.remove(),650);
    if(!loadGame()){showBrief();return}
    document.getElementById('ev').classList.remove('on');
    say('이어하기 — D'+S.day+' '+HOSTS[P.hostIdx].t,'hi');devPanel();
  };
  const sv=peekSave();
  if(sv){
    const d=document.createElement('div');d.className='tres';
    const h=HOSTS[sv.P.hostIdx]||HOSTS[0];
    d.innerHTML='<button id="tResume">이어하기 ▶ <small>'+(ERAS[h.era]||{nm:''}).nm
      +' · D'+(sv.S.day||0)+' · '+h.t+'</small></button>'
      +'<button id="tNew">처음부터</button>';
    t.querySelector('.tin').appendChild(d);
    d.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      e.stopPropagation();
      if(b.id==='tResume')resume();
      else{wipeSave();go()}
    });
  }
  const go=()=>{if(started)return;started=true;
    t.classList.add('out');setTimeout(()=>t.remove(),650);
    const iv=document.getElementById('intro');iv.classList.add('on');
    let ended=false;const fin=()=>{if(ended)return;ended=true;toGame()};
    document.getElementById('iskip').onclick=()=>{cancelAnimationFrame(INTRO.raf);INTRO.on=false;fin()};
    try{intro3d(fin)}catch(e){fin()}};
  t.addEventListener('click',go);
  t.addEventListener('touchstart',e=>{e.preventDefault();go()},{passive:false});
  addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')go()});
})();
document.getElementById('ev').addEventListener('click',e=>{
  if(e.target.tagName==='BUTTON'&&!TUT.started){TUT.started=true;TUT.on=true;setTimeout(tutShow,250)}});

    fetch('version.txt?x='+Date.now(),{cache:'no-store'})

          location.replace(location.pathname+'?v='+v);
        }})
      .catch(()=>{});
