<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIREX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
html,body{margin:0;height:100%;background:#000;color:#efe4e4;font-family:"Noto Sans KR",system-ui,sans-serif}
.nav{position:fixed;top:0;left:0;right:0;z-index:5;background:linear-gradient(#000c,#0000)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px max(20px,env(safe-area-inset-left));max-width:1200px;margin:0 auto}
.nav .brand svg{height:26px;width:auto;display:block}.nav nav{display:flex;flex-wrap:wrap;gap:16px}.nav nav a{color:#d8cfcf;text-decoration:none;font-size:14px}.nav nav a:hover{color:#fff}
.hero{position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:center;background:#000 url(keyart.webp) center right/cover no-repeat}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 0%,#000c 30%,#0000 65%)}
.in{position:relative;padding:0 max(24px,6vw);max-width:1200px;width:100%;margin:0 auto;box-sizing:border-box}
h1{font-family:Unbounded,sans-serif;font-weight:900;font-size:clamp(56px,11vw,150px);letter-spacing:.06em;margin:0;line-height:1;color:#fff;text-shadow:0 0 40px #c0102080}
.soon{display:inline-block;margin-top:22px;font-size:15px;letter-spacing:.5em;color:#ff6a6a;border:1px solid #ff6a6a66;padding:10px 18px 10px 24px}
.back{display:inline-block;margin-top:40px;color:#bfaeae;font-size:14px;text-decoration:none}.back:hover{color:#fff}
@media (prefers-reduced-motion:no-preference){.soon{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.45}}}
</style></head><body>

<section class="hero"><div class="in"><h1>VIREX</h1><div><span class="soon">준비 중</span></div></div></section>
</body></html>
