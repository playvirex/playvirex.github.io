<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VIREX</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#070b0a">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#070b0a;--panel:#0e1715;--panel2:#132220;--line:#223430;--fg:#e4efe9;--dim:#8da39a;
 --accent:#3fe0ad;--accent2:#1b7a60;--warn:#e8b354;--crit:#e2554a;
 --f:'IBM Plex Sans KR',system-ui,sans-serif;--m:'IBM Plex Mono',monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;touch-action:manipulation;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.5;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 display:flex;justify-content:center;overflow:hidden}
#app{width:100%;max-width:480px;display:flex;flex-direction:column;height:100%;overflow:hidden;
 padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
/* 좁은 화면에서 레일은 없는 셈 친다 — 순서는 아래에서 직접 못박는다 */
#rail-l,#rail-r{display:contents}
.top{order:0}#rail-l>.goal{order:1}#warnBox{order:2}.hud{order:3}.micro{order:4}
#mid{order:5}#pick{order:6}#tut{order:7}.acts{order:8}.row2{order:9}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 5px;border-bottom:1px solid rgba(63,224,173,.14)}
.era{font-family:var(--m);font-size:12px;letter-spacing:.14em;color:var(--accent)}
.top h1{margin:0;font-size:17px;letter-spacing:.3em;font-weight:600}
.dname{font-size:13px;color:var(--warn);margin-top:2px;max-width:230px}
.dname small{display:block;font-family:var(--m);font-size:11px;color:var(--dim)}
.clk{font-family:var(--m);font-size:13px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.clk b{display:block;font-size:22px;color:var(--fg)}
.goal{display:flex;gap:8px;align-items:center;background:rgba(63,224,173,.1);border:1px solid var(--accent2);
 border-radius:4px;padding:7px 10px;margin:7px 0 0;font-size:14px}
.goal b{color:var(--accent)}
.warn{display:flex;gap:8px;align-items:flex-start;background:rgba(226,85,74,.12);border:1px solid var(--crit);
 border-radius:4px;padding:7px 10px;margin-top:6px;font-size:14px}
.warn .ic{font-size:19px}.warn b{color:var(--crit)}
.warn small{display:block;font-family:var(--m);font-size:12px;color:var(--dim)}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:6px;
 background:linear-gradient(180deg,rgba(8,14,13,.72),rgba(8,14,13,.28));
 border-top:1px solid rgba(63,224,173,.18);border-bottom:1px solid rgba(63,224,173,.10);
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.micro{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}
.micro .mcell{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:3px;
 padding:5px 8px;overflow:hidden;min-height:46px}
.micro .mimg{position:absolute;inset:0;background-size:cover;background-position:center;
 filter:saturate(1.1);transition:opacity .4s}
.micro .mcell:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,23,21,.92),rgba(14,23,21,.55))}
.micro .mtx{position:relative;z-index:2}
.micro .b{position:relative;z-index:2}
.micro .k{font-family:var(--m);font-size:10.5px;color:var(--dim)}
.micro .v{font-family:var(--m);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.micro .b{height:3px;background:#000;margin-top:3px}.micro .b i{display:block;height:100%}
.hud .cell{background:none;border:0;border-left:1px solid rgba(63,224,173,.12);padding:6px 7px}
.hud .cell:first-child{border-left:0}
.hud .r1{display:flex;align-items:center;gap:4px}
.hud .ic{font-size:13px;width:14px;text-align:center;opacity:.75}
.hud .k{font-size:10.5px;color:var(--dim);flex:1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
.hud .v{font-family:var(--m);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.hud .bar{height:4px;background:#000;margin-top:5px;border-radius:2px;overflow:hidden}
.hud .bar i{display:block;height:100%;transition:width .35s}
.pips{display:flex;gap:3px;margin-top:5px}
.pips span{flex:1;height:5px;background:#000;border-radius:1px}
.pips span.on{background:var(--accent)}.pips.eye span.on{background:var(--warn)}
#mid{flex:1;min-height:90px;display:flex;gap:7px;margin:7px 0;align-items:stretch;position:relative}
/* 3D 장면 = 화면 전체. UI는 그 위에 떠 있다 */
#stage{position:fixed;inset:0;z-index:0;overflow:hidden;
 background:radial-gradient(135% 92% at 50% 36%,#0e1c18 0%,#080d0c 58%,#040706 100%)}
#gl,#body{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#gl{z-index:0}#body{z-index:1;background:transparent}
/* 비네트 + 주사선 + 그레인 */
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;
 background:
  repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),
  radial-gradient(118% 82% at 50% 42%,transparent 38%,rgba(2,5,4,.62) 100%);
 mix-blend-mode:multiply}
#grain::after{content:'';position:absolute;inset:0;opacity:.055;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
 animation:grainshift 1.2s steps(3) infinite}
@keyframes grainshift{0%{transform:translate(0,0)}33%{transform:translate(-3px,2px)}66%{transform:translate(2px,-3px)}}
#app{position:relative;z-index:2;pointer-events:none;background:transparent}
#app button,#tut,#portrait,.sheet,.node{pointer-events:auto}
#portrait{width:112px;flex:0 0 112px;align-self:flex-end;margin-bottom:2px;margin-left:auto;
 background:rgba(8,14,13,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
 border:1px solid rgba(63,224,173,.16);border-radius:5px;max-height:210px;
 overflow:hidden;display:flex;flex-direction:column}
#portrait .pic{flex:0 0 124px;height:124px;background:#0a110f 50% 12%/cover no-repeat;position:relative}
#portrait .pic::after{content:'';position:absolute;inset:0;background:var(--tint,transparent);mix-blend-mode:soft-light}
#portrait .cap{padding:6px 7px;border-top:1px solid var(--line)}
#portrait .st{font-size:14px;font-weight:600;line-height:1.25}
#portrait .vt{font-family:var(--m);font-size:11.5px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
#syms{position:absolute;top:0;left:0;right:120px;display:flex;flex-wrap:wrap;gap:4px;pointer-events:none;align-content:flex-start}
.sym{font-family:var(--m);font-size:12px;padding:3px 7px;border:1px solid var(--line);border-radius:2px;
 background:rgba(7,11,10,.8);color:var(--dim)}
.sym.w{border-color:var(--warn);color:var(--warn)}.sym.c{border-color:var(--crit);color:var(--crit)}
#pick{pointer-events:none;position:relative;margin-bottom:6px;
 background:linear-gradient(180deg,rgba(8,14,13,.80),rgba(8,14,13,.58));
 border:0;border-left:2px solid var(--accent);border-radius:0 4px 4px 0;padding:7px 10px;
 backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#pick .nm{font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:8px}
#pick .nm span:last-child{font-family:var(--m);color:var(--accent);font-size:14px}
#pick .d{font-family:var(--m);font-size:12px;color:var(--dim);margin-top:3px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:0 0 auto}
.acts button{font:inherit;font-size:14px;font-weight:600;padding:9px 3px;background:rgba(14,26,23,.66);
 border:1px solid rgba(63,224,173,.16);color:var(--fg);border-radius:4px;cursor:pointer;line-height:1.3;
 backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:background .18s,border-color .18s}
.acts button .ic{display:block;font-size:19px;line-height:1}
.acts button .aic{width:34px;height:34px;margin:0 auto 1px;background:center/contain no-repeat;filter:drop-shadow(0 0 5px rgba(63,224,173,.45))}
.acts button:disabled .aic{filter:grayscale(.7) brightness(.6)}
.acts button small{display:block;font-family:var(--m);font-size:11px;color:var(--dim);font-weight:400}
.acts button .up{color:var(--accent)}.acts button .dn{color:var(--crit)}
.acts button:disabled{opacity:.3}
.acts button{position:relative}
.acts button.hl,.row2 button.hl{border-color:var(--accent);animation:pulse 900ms ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(63,224,173,.85);filter:brightness(1)}
 50%{box-shadow:0 0 0 9px rgba(63,224,173,0);filter:brightness(1.35)}}
.acts button.hl::after,.row2 button.hl::after{content:'여기 ▼';position:absolute;left:50%;top:-25px;
 transform:translateX(-50%);background:var(--accent);color:#04120d;font-family:var(--m);font-size:11.5px;
 font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap;animation:bob 900ms ease-in-out infinite;z-index:5}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
.row2{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:5px;margin-top:5px;padding-bottom:7px;flex:0 0 auto}
.row2 button{font:inherit;font-size:15px;padding:12px 4px;border-radius:3px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel2);color:var(--fg);position:relative}
.row2 .go{background:var(--accent);color:#04120d;border-color:var(--accent);font-weight:700}
.row2 button:disabled{opacity:.35}

.badge{position:absolute;top:-6px;right:-5px;background:var(--crit);color:#fff;border-radius:9px;
 font-family:var(--m);font-size:11px;padding:1px 6px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(3,6,5,.92);display:none;align-items:flex-end;justify-content:center;z-index:30}
.sheet.on{display:flex}
.sheet .in{width:100%;max-width:540px;background:var(--panel);border-top:1px solid var(--line);
 padding:14px 13px calc(14px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;border-radius:10px 10px 0 0}
.sheet h2{margin:0 0 4px;font-size:16px}
.cap2{font-family:var(--m);font-size:12px;color:var(--dim);margin-bottom:10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}
.tabs button{font:inherit;font-size:13px;padding:8px 2px;border:1px solid var(--line);background:transparent;
 color:var(--dim);border-radius:3px;cursor:pointer}
.tabs button.on{border-color:var(--accent);color:var(--accent);background:rgba(63,224,173,.08)}
.tier{font-family:var(--m);font-size:12px;color:var(--dim);letter-spacing:.08em;margin:13px 0 7px;
 border-top:1px solid var(--line);padding-top:8px}
.node{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;
 background:transparent;border:1px solid var(--line);border-radius:4px;padding:10px 11px;margin-bottom:6px;cursor:pointer}
.node.on{border-color:var(--accent);background:rgba(63,224,173,.09)}
.node.lock{opacity:.55;border-style:dashed}
.node:disabled{cursor:not-allowed}
.node .kb{font-family:var(--m);font-size:11.5px;color:var(--dim);text-align:right;min-width:38px;white-space:nowrap}
.node b{display:block;font-size:15px}
.node .pm{font-family:var(--m);font-size:12.5px;margin-top:3px}
.node .pm .p{color:var(--accent);display:block}
.node .pm .n{color:var(--crit);display:block}
.node .bs{display:block;font-size:11.5px;color:var(--dim);margin-top:4px}
.node .tr{display:block;font-size:12px;color:var(--warn);margin-top:4px;font-family:var(--m)}
.trow{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;
 padding:9px 10px;margin-bottom:5px}
.trow.done{border-color:var(--accent);background:rgba(63,224,173,.07)}
.trow .mk{font-size:16px}
.trow b{display:block;font-size:14px}
.trow small{display:block;font-family:var(--m);font-size:12px;color:var(--dim)}
.closeb{width:100%;margin-top:9px;padding:12px;background:var(--accent);color:#04120d;border:0;border-radius:3px;
 font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.logl{font-family:var(--m);font-size:13px;color:var(--dim)}
.logl p{margin:0 0 7px;padding-left:9px;border-left:2px solid var(--line)}
.logl p.hi{color:var(--accent);border-color:var(--accent)}
.logl p.bad{color:var(--crit);border-color:var(--crit)}
#ev{position:fixed;inset:0;background:rgba(4,8,7,.95);display:none;z-index:40;align-items:center;justify-content:center}
#ev.on{display:flex}
#ev .card{width:100%;max-width:430px;margin:0 13px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
#ev .hero{width:100%;aspect-ratio:16/9;background:#0a110f center/cover no-repeat;position:relative;overflow:hidden}
#ev .hero.tall{aspect-ratio:6/5}
#plx{position:absolute;inset:0;display:none}
#plx.on{display:block}
#plx i{position:absolute;inset:-9%;display:block;background:center/cover no-repeat;will-change:transform}
#plM{background-size:auto 86%!important;background-position:46% 96%!important}
#plx::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 45%,rgba(4,8,7,.72) 100%)}
#ev .tx{padding:15px 15px calc(15px + env(safe-area-inset-bottom,0px))}
#ev .tag{font-family:var(--m);font-size:12px;letter-spacing:.1em;color:var(--dim)}
#ev h3{margin:6px 0 9px;font-size:21px;font-weight:600;text-wrap:balance}
#ev q{display:block;color:var(--dim);font-style:italic;font-size:15px;margin-bottom:10px;line-height:1.55}
#ev .vit{font-family:var(--m);font-size:13px;color:var(--dim);margin-bottom:11px;font-variant-numeric:tabular-nums}
#ev button{width:100%;padding:13px;background:transparent;border:1px solid var(--line);color:var(--fg);
 font:inherit;font-size:16px;border-radius:3px;cursor:pointer}
#tut{display:none;margin-bottom:6px}
#tut.on{display:block}
#tut .box{background:#0d1b17;border:1px solid var(--accent);border-radius:5px;padding:9px 11px}
#tut .step{font-family:var(--m);font-size:11.5px;color:var(--accent);letter-spacing:.08em}
#tut p{margin:3px 0 8px;font-size:14px;line-height:1.5}
#tut .btns{display:flex;gap:6px}
#tut button{flex:1;padding:8px 4px;border-radius:3px;border:1px solid var(--line);background:transparent;
 color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
#tut button.pri{background:var(--accent);color:#04120d;border-color:var(--accent);font-weight:700}
#tut button:disabled{opacity:.35}
.i{width:1em;height:1em;display:inline-block;vertical-align:-.14em;fill:none;stroke:currentColor;
 stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i.fill{fill:currentColor;stroke:none}
.hud .ic .i{width:17px;height:17px}
.acts .ic .i{width:21px;height:21px}
#graphWrap{overflow:auto;border:1px solid var(--line);border-radius:4px;background:#0a110f;margin-bottom:10px}
#graphWrap svg{display:block}
.gnode{cursor:pointer}
#detail{border:1px solid var(--line);border-radius:4px;padding:11px 12px;margin-bottom:9px;background:var(--panel2)}
#detail h3{margin:0 0 3px;font-size:16px}
#detail .bs{font-size:12px;color:var(--dim);font-family:var(--m)}
#detail .pm{font-family:var(--m);font-size:13px;margin-top:7px}
#detail .pm .p{color:var(--accent);display:block}
#detail .pm .n{color:var(--crit);display:block}
#detail .tr{color:var(--warn);font-family:var(--m);font-size:12.5px;margin-top:6px}
#detail .act{width:100%;margin-top:9px;padding:10px;border-radius:3px;font:inherit;font-size:15px;
 font-weight:700;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#04120d}
#detail .act.off{background:transparent;color:var(--dim);border-color:var(--line);cursor:not-allowed}
#detail .act.rm{background:transparent;color:var(--crit);border-color:var(--crit)}
.legend{display:flex;gap:11px;flex-wrap:wrap;font-family:var(--m);font-size:11.5px;color:var(--dim);margin-bottom:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
#treeView{position:fixed;inset:0;z-index:60;background:#050908;display:none;flex-direction:column;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#treeView.on{display:flex}
.tvtop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;
 border-bottom:1px solid var(--line)}
.tvtop b{font-family:var(--m);font-size:17px;color:var(--accent);display:block}
.tvtop span{font-family:var(--m);font-size:11.5px;color:var(--dim)}
.tvtop button{font:inherit;font-size:14px;padding:8px 16px;white-space:nowrap;border:1px solid var(--line);background:transparent;
 color:var(--fg);border-radius:3px;cursor:pointer}
.tvwrap{flex:1;min-height:0;position:relative}
#tvc{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.tvwrap{background:#050908 center/cover no-repeat}
#tvPop{display:none;position:absolute;width:292px;background:#0c1613;border:1px solid var(--accent);
 border-radius:6px;padding:10px 11px;box-shadow:0 10px 32px rgba(0,0,0,.7);z-index:5}
#tvPop.on{display:block}
#tvPop .ph b{display:block;font-size:15px}
#tvPop .ph i{display:block;font-style:normal;font-family:var(--m);font-size:11px;color:var(--dim);margin-top:1px}
#tvPop .pm{font-family:var(--m);font-size:12.5px;margin-top:6px}
#tvPop .pm .p{color:var(--accent);display:block}
#tvPop .pm .n{color:var(--crit);display:block}
#tvPop .bs{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.45}
#tvPop .tr{font-family:var(--m);font-size:11.5px;color:var(--warn);margin-top:5px}
#tvPop .act{width:100%;margin-top:8px;padding:9px;border-radius:3px;font:inherit;font-size:14px;font-weight:700;
 cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#04120d}
#tvPop .act.off{background:transparent;color:var(--dim);border-color:var(--line);cursor:not-allowed}
#tvPop .act.rm{background:transparent;color:var(--crit);border-color:var(--crit)}
.tvlegend{display:flex;gap:9px;flex-wrap:wrap;padding:6px 12px;font-family:var(--m);font-size:11px;
 color:var(--dim);border-top:1px solid var(--line)}
.tvlegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.tvlegend i.lni{width:18px;height:18px;background:center/contain no-repeat;border-radius:0;vertical-align:-5px}
.tvdetail{border-top:1px solid var(--line);padding:11px 12px calc(11px + env(safe-area-inset-bottom,0px));
 background:var(--panel);max-height:38vh;overflow-y:auto}
.tvdetail h3{margin:0 0 2px;font-size:16px}
.tvdetail .bs{font-family:var(--m);font-size:11.5px;color:var(--dim)}
.tvdetail .pm{font-family:var(--m);font-size:13px;margin-top:6px}
.tvdetail .pm .p{color:var(--accent);display:block}
.tvdetail .pm .n{color:var(--crit);display:block}
.tvdetail .tr{font-family:var(--m);font-size:12.5px;color:var(--warn);margin-top:5px}
.tvdetail .act{width:100%;margin-top:9px;padding:11px;border-radius:3px;font:inherit;font-size:15px;
 font-weight:700;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#04120d}
.tvdetail .act.off{background:transparent;color:var(--dim);border-color:var(--line);cursor:not-allowed}
.tvdetail .act.rm{background:transparent;color:var(--crit);border-color:var(--crit)}
#intro{position:fixed;inset:0;z-index:72;background:#040303;display:none}
#intro.on{display:block}
/* 인트로는 세 겹이다: 혈장(CSS) → 세포와 비리온(WebGL) → 벽·수용체·자막(2D) */
#intro{background:radial-gradient(ellipse 85% 85% at 50% 45%,#160a0c 0%,#0a0608 55%,#040303 100%)}
#i3g,#i3c{position:absolute;inset:0;display:block;width:100%;height:100%}
#i3g{z-index:1}#i3c{z-index:2}
#iskip{position:absolute;z-index:3;right:max(14px,env(safe-area-inset-right,0px));
 bottom:max(14px,env(safe-area-inset-bottom,0px));padding:9px 14px;border-radius:3px;
 border:1px solid rgba(228,239,233,.35);background:rgba(4,8,7,.5);color:#cfe0d8;
 font:inherit;font-size:14px;cursor:pointer;backdrop-filter:blur(3px)}
#title{position:fixed;inset:0;z-index:70;background:#000 url(keyart.webp) center right/cover no-repeat;
 display:flex;align-items:center;cursor:pointer;transition:opacity .6s ease}
#title:before{content:"";position:absolute;inset:0;
 background:linear-gradient(90deg,#000 0%,#000c 32%,#0000 68%)}
#title.out{opacity:0;pointer-events:none}
#devp{position:fixed;left:8px;bottom:8px;z-index:90;background:rgba(6,12,11,.93);
 border:1px solid #c8a34a;border-radius:4px;padding:8px 10px;font-family:var(--m);font-size:11.5px;
 color:#e8dcc0;display:flex;flex-direction:column;gap:4px;max-width:260px;backdrop-filter:blur(4px)}
#devp b{color:#f0c558;letter-spacing:.18em;font-size:10.5px}
#devp label{display:flex;align-items:center;gap:6px;justify-content:space-between}
#devp input,#devp select{font:inherit;background:#0b1413;color:#e8dcc0;border:1px solid #3a4440;
 border-radius:3px;padding:3px 5px;width:150px}
#devp .dvr{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
#devp .dvr button{font:inherit;font-size:11px;padding:4px 7px;border-radius:3px;cursor:pointer;
 background:#17211e;color:#e8dcc0;border:1px solid #4a5550}
#devp .dvr button:hover{border-color:#c8a34a}
.tres{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.tres button{font:inherit;font-size:15px;padding:11px 18px;border-radius:4px;cursor:pointer;
 border:1px solid rgba(63,224,173,.45);background:rgba(8,18,16,.72);color:#cfe8dd;
 backdrop-filter:blur(4px);text-align:left}
.tres button#tResume{background:var(--accent);color:#04120d;border-color:var(--accent);font-weight:700}
.tres button small{display:block;font-family:var(--m);font-size:11.5px;opacity:.78;font-weight:400;margin-top:2px}
#title .tin{position:relative;padding:0 max(24px,6vw);width:100%;max-width:1200px;margin:0 auto;box-sizing:border-box}
#title h2{margin:0;font-family:'IBM Plex Sans KR',system-ui,sans-serif;font-weight:700;
 font-size:clamp(54px,11vw,140px);letter-spacing:.07em;line-height:1;color:#fff;text-shadow:0 0 40px #c0102080}
#title .tts{margin-top:26px;font-family:var(--m);font-size:14px;letter-spacing:.42em;color:#ff8f8f;
 border:1px solid #ff6a6a55;padding:11px 16px 11px 22px;display:inline-block;animation:tblink 2.1s ease-in-out infinite}
@keyframes tblink{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){#title .tts{animation:none}*{transition:none!important}}
/* ═══ 넓은 화면: 폰 기둥을 버리고 화면 전체를 쓴다 ═══ */
@media (min-width:820px){
 #app{max-width:none;padding-left:34px;padding-right:34px}
 .top{padding:13px 4px 9px}
 .top h1{font-size:23px;letter-spacing:.42em}
 .dname{font-size:15px;max-width:460px}
 .clk b{font-size:28px}
 .goal{max-width:520px;font-size:15px}
 #warnBox{max-width:520px}
 .hud{grid-template-columns:repeat(4,1fr)}
 .hud .k{font-size:12.5px;flex:0 1 auto}
 .hud .r1{gap:9px}
 .hud .cell{padding:7px 16px}
 .hud .v{font-size:21px}
 .hud .ic{font-size:15px;width:18px}
 .micro{max-width:620px;grid-template-columns:repeat(3,1fr)}
 .micro .mcell{min-height:46px}
 .micro .k{font-size:12px}.micro .v{font-size:15px}
 #mid{min-height:0;margin:10px 0}
 #syms{right:260px}
 #portrait{position:absolute;right:0;top:50%;transform:translateY(-50%);
   width:216px;flex-basis:216px;max-height:none;align-self:auto;margin:0}
 #portrait .pic{flex:0 0 228px;height:228px}
 #portrait .st{font-size:16px}
 #pick{max-width:620px}
 #pick .nm{font-size:17px}
 #pick .d{font-size:13px}
 #tut{max-width:720px;margin-left:auto;margin-right:auto}
 .acts{max-width:820px;margin:0 auto;width:100%}
 .acts button{font-size:15px;padding:12px 4px}
 .row2{max-width:820px;margin:6px auto 0;width:100%}
 .row2 button{font-size:16px;padding:14px 4px}
 #ev .card{max-width:860px;max-height:93vh;display:flex;flex-direction:column}
 #ev .hero{aspect-ratio:auto!important;height:40vh;flex:0 0 auto}
 #ev .hero.tall{aspect-ratio:auto!important;height:46vh}
 #ev .tx{padding:18px 24px;overflow-y:auto;flex:1 1 auto}
}
@media (min-width:1280px){
 #app{padding-left:56px;padding-right:56px}
 #portrait{width:250px;flex-basis:250px}
 #portrait .pic{flex:0 0 264px;height:264px}
 #ev .card{max-width:1000px}
 #ev .hero.tall{height:50vh}
}
/* 가로가 넓거나 세로가 짧을 때: 위아래 패널을 눌러서 몸에 공간을 준다 */
@media (min-width:820px){
 .goal{padding:5px 10px;margin-top:5px}
 .micro{margin-top:4px}
 .micro .mcell{min-height:34px;padding:3px 8px}
 .acts{grid-template-columns:repeat(6,1fr);max-width:980px}
 .acts button{padding:7px 3px;font-size:13.5px}
 .acts button .ic{font-size:16px}
 .acts button small{font-size:10.5px}
 .row2{max-width:980px;margin-top:5px;padding-bottom:6px}
 .row2 button{padding:10px 4px;font-size:15px}
 #pick{max-width:440px;margin-bottom:5px;padding:6px 10px}
 #pick .d{font-size:12px}
 #mid{margin:7px 0 0}
 #portrait{top:auto;bottom:0;transform:none;max-height:calc(100% - 6px)}
 #portrait .pic{flex:0 0 180px;height:180px}
}
@media (max-height:820px){
 .top{padding:7px 2px 4px}
 .top h1{font-size:19px}
 .dname{font-size:13px}
 .clk b{font-size:22px}
 .goal{font-size:13.5px;padding:4px 10px}
 .micro .mcell{min-height:30px}
 .acts button{padding:6px 3px}
 .row2 button{padding:9px 4px}
 #portrait .pic{flex:0 0 150px;height:150px}
}

/* ═══ 화면 정리: 정보는 그대로, 테두리와 상자만 걷어낸다 ═══ */
.goal{background:none;border:0;border-radius:0;padding:4px 2px 5px;margin:4px 0 0;
  color:var(--fg);font-size:14px}
.goal b{color:var(--accent)}
#warnBox .warn{background:none;border:0;border-left:2px solid var(--crit);
  border-radius:0;padding:4px 0 4px 9px;margin-top:4px}
.hud{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;
  border-top:1px solid rgba(63,224,173,.16);border-bottom:0}
.hud .bar{max-width:150px}
.hud .pips{max-width:150px}
.micro{border-top:1px solid rgba(63,224,173,.10);padding-top:5px;gap:0}
.micro .mcell{background:none!important;border:0;border-left:1px solid rgba(63,224,173,.10);
  border-radius:0;padding:4px 10px;min-height:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.micro .mcell:first-child{border-left:0}
.micro .mimg{opacity:.22}
.micro .mcell:after{background:linear-gradient(90deg,rgba(7,11,10,.88),rgba(7,11,10,.62))}
.micro .b{height:2px;max-width:140px}
.sym{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:2px 2px 1px}
.sym.w{border-color:var(--warn)}.sym.c{border-color:var(--crit)}
#syms{gap:9px}
#portrait{border:0;background:rgba(8,14,13,.5)}
#portrait .cap{border-top:1px solid rgba(63,224,173,.12)}
.acts button{background:rgba(10,18,16,.5);border-color:rgba(63,224,173,.10)}
.acts button.hl{border-color:var(--accent)}
.row2 button{background:rgba(10,18,16,.5);border-color:rgba(63,224,173,.10)}
.row2 .go{background:var(--accent);border-color:var(--accent)}
#grain{background:
  repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px),
  radial-gradient(120% 84% at 50% 42%,transparent 44%,rgba(2,5,4,.58) 100%)}
@media (min-width:820px){
  .goal{font-size:15px;max-width:560px}
  .hud .bar,.hud .pips{max-width:200px}
  .micro{max-width:660px}
  .micro .b{max-width:180px}
}

/* ═══ 넓은 화면: 숙주를 가운데 비워두고 모든 패널을 양옆으로 민다 ═══ */
@media (min-width:1180px){
 #app{display:grid;align-content:stretch;
   grid-template-columns:minmax(286px,340px) minmax(0,1fr) minmax(286px,340px);
   grid-template-rows:auto minmax(0,1fr) auto;
   column-gap:34px;padding-left:40px;padding-right:40px}
 .top{grid-column:1/-1;grid-row:1}
 #rail-l,#rail-r{display:flex;flex-direction:column;gap:6px;min-height:0}
 #rail-l{grid-column:1;grid-row:2;justify-content:flex-start;padding-top:6px}
 #rail-r{grid-column:3;grid-row:2/4;justify-content:flex-end;padding-bottom:8px}
 /* 안내도 가운데를 비켜 왼쪽 아래에 선다 */
 #tut{grid-column:1;grid-row:3;align-self:end;max-width:none;margin:0 0 10px}

 /* 레일 안에서는 가로로 넓힐 이유가 없다 — 폭을 레일에 맞춘다 */
 .goal,#warnBox,.micro,#pick{max-width:none}
 .goal{margin:0;padding:2px 0 6px}
 .hud{grid-template-columns:1fr 1fr;margin-top:0;border-bottom:1px solid rgba(63,224,173,.16)}
 .hud .cell{padding:7px 10px}
 .hud .cell:nth-child(3){border-left:0}
 .hud .cell:nth-child(-n+2){border-bottom:1px solid rgba(63,224,173,.10)}
 .hud .bar,.hud .pips{max-width:none}
 .micro{grid-template-columns:1fr 1fr 1fr}
 .micro .b{max-width:none}
 #pick{margin-bottom:0}

 /* 오른쪽 레일: 증상 → 숙주 초상 → 행동 → 턴 */
 #mid{flex:0 1 auto;min-height:0;display:block;margin:0 0 6px}
 #syms{position:static;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:7px}
 #portrait{position:static;transform:none;width:100%;flex-basis:auto;max-height:none;
   margin:0;align-self:auto;display:flex;flex-direction:column}
 #portrait .pic{flex:0 0 190px;height:190px}
 .acts{grid-template-columns:1fr 1fr;max-width:none;margin:0;gap:6px}
 .acts button{padding:9px 4px;font-size:14px}
 .row2{grid-template-columns:1fr 1fr;max-width:none;margin:6px 0 0;padding-bottom:0;gap:6px}
 .row2 .go{grid-column:1/-1}
}
@media (min-width:1180px) and (max-height:900px){
 #portrait .pic{flex:0 0 150px;height:150px}
 .acts button{padding:7px 4px}
 .row2 button{padding:10px 4px}
}
</style>
</head>

const LINES=Object.entries(CAT).map(([k,v])=>({k,nm:v.nm,ang:v.ang,col:v.col}));
const LINECOL=Object.fromEntries(LINES.map(L=>[L.k,L.col]));
const GN={},GE=[];
const RADT=[0,160,310,460,610];
function glink(a,b){if(GN[a]&&GN[b]&&!GE.some(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a)))GE.push([a,b])}

GN.core={id:'core',nm:'수용체 결합',kind:'core',cost:0,line:'·',t:0,x:0,y:0,
  p:['모든 감염의 시작점'],n:[],bs:'외피 단백질의 숙주 수용체 부착 — 여기서 모든 계통이 뻗어 나간다',fx:{}};

LINES.forEach(L=>{
  const nodes=CAT[L.k].nodes;
  const byT={};nodes.forEach(n=>{(byT[n.t]=byT[n.t]||[]).push(n)});
  const sector=(360/LINES.length)*0.92;
  Object.keys(byT).forEach(tk=>{
    const t=+tk,arr=byT[tk],rad=RADT[t];
    arr.forEach((n,i)=>{
      const frac=arr.length===1?0:(i/(arr.length-1)-0.5);
      const a=(L.ang+frac*sector*(t===1?0.75:1.0))*Math.PI/180;
      GN[n.id]={...n,kind:n.t>=4?'key':(n.t>=3?'notable':'minor'),cost:n.c,line:L.k,
        x:Math.cos(a)*rad,y:Math.sin(a)*rad};
    });
  });
});
// 연결: 선행 노드 ↔, 없으면 중심 또는 같은 계통 한 단계 위
Object.values(GN).forEach(n=>{
  if(n.id==='core')return;
  if(n.req&&n.req.length){n.req.forEach(r=>glink(r,n.id));return}
  if(n.t===1){glink('core',n.id);return}
  const up=Object.values(GN).filter(m=>m.line===n.line&&m.t===n.t-1)
    .sort((a,b)=>Math.hypot(a.x-n.x,a.y-n.y)-Math.hypot(b.x-n.x,b.y-n.y))[0];
  glink(up?up.id:'core',n.id);
});

  const prj=(x,y,z)=>{const s=F()/Math.max(0.1,z);return[W/2+x*s,H/2+y*s,s]};

  /* 섬유소·부유 입자 */
  const DUST=[];
  for(let i=0;i<260;i++)DUST.push({x:(Math.random()-.5)*1300,y:(Math.random()-.5)*900,
    z:120+Math.random()*4400,s:.6+Math.random()*1.9});

  /* 비리온: 정이십면체 꼭짓점에 스파이크 */
  const PHI=(1+Math.sqrt(5))/2;
  const V=[];
  [[-1,PHI,0],[1,PHI,0],[-1,-PHI,0],[1,-PHI,0],[0,-1,PHI],[0,1,PHI],[0,-1,-PHI],[0,1,-PHI],
   [PHI,0,-1],[PHI,0,1],[-PHI,0,-1],[-PHI,0,1]].forEach(p=>{
    const L=Math.hypot(...p);V.push([p[0]/L,p[1]/L,p[2]/L])});
  // 꼭짓점 사이를 더 촘촘히 — 각 면 중심도 스파이크로
  const SP=V.slice();
  for(let i=0;i<V.length;i++)for(let j=i+1;j<V.length;j++){
    const d=Math.hypot(V[i][0]-V[j][0],V[i][1]-V[j][1],V[i][2]-V[j][2]);
    if(d<1.08){const m=[(V[i][0]+V[j][0])/2,(V[i][1]+V[j][1])/2,(V[i][2]+V[j][2])/2];
      const L=Math.hypot(...m);SP.push([m[0]/L,m[1]/L,m[2]/L])}
  }

  const rotY=(p,a)=>[p[0]*Math.cos(a)+p[2]*Math.sin(a),p[1],-p[0]*Math.sin(a)+p[2]*Math.cos(a)];
  const rotX=(p,a)=>[p[0],p[1]*Math.cos(a)-p[2]*Math.sin(a),p[1]*Math.sin(a)+p[2]*Math.cos(a)];

  /* 상피세포 표면: 격자 평면 + 수용체 돌기 */
  const RECEP=[];
  for(let i=-10;i<=10;i++)for(let j=-8;j<=8;j++){
    if(Math.random()<.52)continue;                         // 듬성듬성 — 격자 티를 없앤다
    RECEP.push({x:i*104+(j%2?52:0)+(Math.random()-.5)*62,
                y:j*100+(Math.random()-.5)*58,
                s:.45+Math.random()*1.15,ph:Math.random()*6.28});
  }
  /* 상피세포 경계: 불규칙한 다각형 — 세포가 맞붙은 면 */
  const CELLS=[];
  for(let i=-4;i<=4;i++)for(let j=-3;j<=3;j++){
    const cxp=i*290+(j%2?145:0)+(Math.random()-.5)*70, cyp=j*272+(Math.random()-.5)*70;
    const n=6+Math.floor(Math.random()*3), pts=[];
    for(let k=0;k<n;k++){const a=k/n*6.283+Math.random()*.34, r=120+Math.random()*78;
      pts.push([cxp+Math.cos(a)*r, cyp+Math.sin(a)*r*.92])}
    CELLS.push(pts);
  }

  initG3();fitG3();
  addEventListener('resize',fitG3);

  const DUR=9200;                                  // 전체 길이(ms)
  let t0=null;
  let _m=null,_q=null,_e=null,_p=null,_s=null;   // three 가 온 뒤에 만든다

  function draw(ts){
    if(!t0)t0=ts;
    /* three 는 비동기로 온다 — 도착하는 프레임에 3D 층을 세운다 */
    if(!G3.on&&!G3.dead&&typeof GL!=='undefined'&&GL.T){initG3();if(G3.on)fitG3();else G3.dead=true}
    const t=ts-t0, p=Math.min(1,t/DUR);
    INTRO.t=p;
    g.clearRect(0,0,W,H);

    /* 배경: 혈장 — 3D 층이 있으면 그 밑에 깔려야 하므로 CSS 가 맡는다 */
    if(!G3.on){
      const bg=g.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.max(W,H)*.85);
      bg.addColorStop(0,'#160a0c');bg.addColorStop(.55,'#0a0608');bg.addColorStop(1,'#040303');
      g.fillStyle=bg;g.fillRect(0,0,W,H);
    }

    /* 카메라 전진 속도: 초반 빠르게 → 접안하며 감속 */
    const speed=p<.62? 7.5-p*4 : Math.max(.5,3.2-(p-.62)*7);
    const list=[];

    /* 부유 입자 */
    DUST.forEach(d=>{
      d.z-=speed*1.6;if(d.z<60){d.z+=4400;d.x=(Math.random()-.5)*1300;d.y=(Math.random()-.5)*900}
      const q=prj(d.x,d.y,d.z);
      if(q[2]>0)list.push({z:d.z,kind:'dust',x:q[0],y:q[1],r:Math.min(2.4,d.s*q[2]*1.1)});
    });

    /* 적혈구 */
    RBC.forEach(c=>{
      c.z-=speed*1.1;c.ax+=c.sx;c.ay+=c.sy;c.x+=c.vx;c.y+=c.vy;
      if(c.z<90){c.z+=4200;c.x=(Math.random()-.5)*900;c.y=(Math.random()-.5)*620}
      const q=prj(c.x,c.y,c.z);
      if(q[2]<=0)return;
      const vzNow=(p<.62)? 900-p*620 : Math.max(150,520-(p-.62)*900);
      if(p>.55&&c.z<vzNow+150){c.z=vzNow+900+Math.random()*600;return}   // 시야 앞을 비운다
      const fade=p>.72? Math.max(0,1-(p-.72)/.22) : 1;
      if(fade<=0.02){c.vis=0;return}
      c.vis=fade;
      if(!G3.on)list.push({z:c.z,kind:'rbc',x:q[0],y:q[1],R:c.r*q[2],ax:c.ax,ay:c.ay,fade:fade});
    });

    /* 3D 적혈구: 같은 좌표를 그대로 쓰되 y와 z의 방향만 뒤집는다 */
    if(G3.on&&G3.rbc){
      if(!_m){const T=G3.T;_m=new T.Matrix4();_q=new T.Quaternion();
        _e=new T.Euler();_p=new T.Vector3();_s=new T.Vector3()}
      let fadeMax=0;
      RBC.forEach((c,i)=>{
        const v=c.vis===undefined?1:c.vis;
        if(v>fadeMax)fadeMax=v;
        _p.set(c.x,-c.y,-c.z);
        _e.set(c.ax,c.ay,c.ax*0.6);_q.setFromEuler(_e);
        const r=v<=0?0:c.r*2;                       // 반지름 c.r → 지름으로 환산
        _s.set(r,r,r);
        _m.compose(_p,_q,_s);
        G3.rbc.setMatrixAt(i,_m);
      });
      G3.rbc.instanceMatrix.needsUpdate=true;
      G3.rbc.material.opacity=Math.max(0,Math.min(1,fadeMax));
    }

    /* 세포 표면: 후반에 앞에서 다가온다 */
    const wallZ=Math.max(430,4200-p*4050);
    const near=wallZ<1700? Math.min(1,(1700-wallZ)/1700) : 0;   // 표면이 다가올수록 드러난다
    if(near>0){
      RECEP.forEach(r=>{
        const q=prj(r.x,r.y,Math.max(40,wallZ));
        if(q[2]<=0)return;
        list.push({z:wallZ+1,kind:'rec',x:q[0],y:q[1],R:6*r.s*q[2],ph:r.ph,a:near});
      });
      CELLS.forEach(pts=>{
        const pp=pts.map(p=>prj(p[0],p[1],Math.max(40,wallZ)));
        list.push({z:wallZ+1.5,kind:'cell',pts:pp,a:near});
      });
      list.push({z:wallZ+2,kind:'wall',w:wallZ,a:near});
    }

    /* 비리온: 화면 중앙 약간 위, 접안하며 커진다 */
    const vz=(p<.62)? 900-p*620 : Math.max(150,520-(p-.62)*900);
    const vrot=t*0.00042;
    if(G3.on){
      const o=G3.vir;                 // 아직 안 왔으면 아무것도 그리지 않는다
      if(o){
        o.visible=true;
        o.position.set(0,30,-vz);                  // 2D의 (0,-30) 과 같은 자리
        o.rotation.set(vrot*0.62,vrot,vrot*0.28);
        const R=78*(1+Math.sin(vrot*2.1)*0.035);   // 자전에 따른 미세한 호흡
        o.scale.setScalar(R);
      }
    }else{
      list.push({z:vz,kind:'virion',rot:vrot});
    }

    list.sort((a,b)=>b.z-a.z);

    list.forEach(o=>{
      if(o.kind==='dust'){
        g.beginPath();g.arc(o.x,o.y,Math.max(.4,o.r),0,7);
        g.fillStyle='rgba(170,205,195,'+Math.min(.34,o.r*.16)+')';g.fill();
      }
      if(o.kind==='rbc'){
        // 빌보드: 카메라를 향한 판 — 자전축 기울기만큼 세로로 눌러 입체감을 준다
        const nz0=Math.abs(Math.cos(o.ax)*Math.cos(o.ay));
        const nz=.34+nz0*.66;                         // 완전히 모서리로 서지 않게 — 납작한 사각형 방지
        const rx=o.R*(.82+nz0*.18), ry=o.R*nz;
        const fd=o.fade===undefined?1:o.fade;
        g.save();g.translate(o.x,o.y);g.rotate(o.ay);
        g.globalAlpha=Math.min(1,fd*(.5+nz0*.5));
        if(imrOK){
          // 타원으로 잘라낸 뒤 그린다 — 원본의 네모난 가장자리가 드러나지 않게
          g.beginPath();g.ellipse(0,0,rx,ry,0,0,7);g.clip();
          g.drawImage(IMR,-rx,-ry,rx*2,ry*2);
        }else{
          const gr=g.createRadialGradient(0,0,ry*.1,0,0,rx);
          gr.addColorStop(0,'rgba(78,14,18,.8)');gr.addColorStop(.62,'rgba(132,26,30,.85)');
          gr.addColorStop(1,'rgba(44,8,11,0)');
          g.fillStyle=gr;g.beginPath();g.ellipse(0,0,rx,ry,0,0,7);g.fill();
        }
        g.restore();g.globalAlpha=1;
      }
      if(o.kind==='wall'){
        const k=o.a===undefined?1:o.a;
        const gr=g.createRadialGradient(W/2,H*.48,0,W/2,H*.48,Math.max(W,H)*.9);
        gr.addColorStop(0,'rgba(12,30,27,'+.90*k+')');
        gr.addColorStop(.55,'rgba(6,16,15,'+.94*k+')');
        gr.addColorStop(1,'rgba(2,6,6,'+.97*k+')');
        g.fillStyle=gr;g.fillRect(0,0,W,H);
      }
      if(o.kind==='cell'){
        const k=(o.a===undefined?1:o.a)*(o.a*o.a);
        g.beginPath();o.pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
        g.strokeStyle='rgba(74,150,126,'+(.17*k).toFixed(3)+')';g.lineWidth=1.1;g.stroke();
        
      }
      if(o.kind==='rec'){
        const a=(.09+Math.abs(Math.sin(o.ph+t*.0012))*.17)*(o.a===undefined?1:o.a*o.a);
        const R=Math.max(.7,o.R);
        const gr=g.createRadialGradient(o.x,o.y,0,o.x,o.y,R*1.9);
        gr.addColorStop(0,'rgba(104,240,196,'+a*1.25+')');
        gr.addColorStop(.45,'rgba(63,224,173,'+a*.5+')');
        gr.addColorStop(1,'rgba(63,224,173,0)');
        g.fillStyle=gr;g.beginPath();g.arc(o.x,o.y,R*1.9,0,7);g.fill();
      }
      if(o.kind==='virion'){
        const q=prj(0,-30,o.z),s=q[2];
        const R=78*s;
        if(imvOK){
          // 뒤쪽 산란광
          const hl=g.createRadialGradient(q[0],q[1],R*.4,q[0],q[1],R*2.1);
          hl.addColorStop(0,'rgba(50,200,166,.30)');hl.addColorStop(1,'rgba(20,120,100,0)');
          g.fillStyle=hl;g.beginPath();g.arc(q[0],q[1],R*2.1,0,7);g.fill();
          // 빌보드 — 천천히 구르는 느낌만 주되 과하지 않게
          g.save();g.translate(q[0],q[1]);g.rotate(o.rot*.55);
          const wob=1+Math.sin(o.rot*2.1)*.035;      // 자전에 따른 미세한 호흡
          g.drawImage(IMV,-R*wob,-R/wob,R*2*wob,R*2/wob);
          g.restore();
        }else{
          const gr=g.createRadialGradient(q[0]-R*.3,q[1]-R*.35,R*.08,q[0],q[1],R*1.05);
          gr.addColorStop(0,'rgba(120,255,214,.95)');
          gr.addColorStop(.45,'rgba(32,150,118,.9)');
          gr.addColorStop(1,'rgba(8,46,38,.95)');
          g.fillStyle=gr;g.beginPath();g.arc(q[0],q[1],R,0,7);g.fill();
        }
        // 접안 섬광
        if(p>.9){const f=(p-.9)/.1;
          g.fillStyle='rgba(180,255,230,'+(f*f*.85)+')';g.fillRect(0,0,W,H)}
      }
    });

    /* 3D 층을 그려 넣는다 — 2D는 그 위에 벽과 자막만 얹는다 */
    if(G3.on){try{G3.r.render(G3.sc,G3.cam)}catch(e){G3.on=false}}

    /* 접안 섬광 */
    if(G3.on&&p>.9){const f=(p-.9)/.1;
      g.fillStyle='rgba(180,255,230,'+(f*f*.85)+')';g.fillRect(0,0,W,H)}

    /* 자막 */
    const CAP=[[0.05,0.26,'수십억 년, 당신은 경계에 있었다'],
               [0.30,0.56,'살아 있다고도, 죽었다고도 할 수 없는'],
               [0.60,0.86,'이제 문 하나가 열린다']];
    CAP.forEach(([a,b,txt])=>{
      if(p<a||p>b)return;
      const k=(p-a)/(b-a);
      const al=Math.min(1,Math.min(k*5,(1-k)*5));
      g.font='600 '+Math.max(15,Math.min(26,W*0.042))+'px "IBM Plex Sans KR", system-ui, sans-serif';
      g.textAlign='center';g.fillStyle='rgba(228,239,233,'+al*.92+')';
      g.fillText(txt,W/2,H-Math.max(56,H*0.13));
    });

    if(p>=1){cancelAnimationFrame(INTRO.raf);INTRO.on=false;onEnd();return}
    INTRO.raf=requestAnimationFrame(draw);
  }
  INTRO.on=true;
  INTRO.raf=requestAnimationFrame(draw);
}

/* ═══ 효과 엔진 ═══ */
function FX(){
  const F={rec:{},recAll:1,inv:1,yld:1,dmg:1,shed:1,route:{},alert:1,abRes:0,ifnRes:0,tRes:1,
    extRes:0,mp:1,fit:0,fitCut:0,cap:0,ep:0,bactDown:0,score:1,drainAdd:0,spread:1,abDecay:0,innateSelf:1,sp:{}};
  P.nodes.forEach(id=>{
    const n=N(id),f=n.fx||{};
    if(f.rec)for(const k in f.rec)F.rec[k]=(F.rec[k]||1)*f.rec[k];
    if(f.route)for(const k in f.route)F.route[k]=(F.route[k]||0)+f.route[k];
    ['recAll','inv','yld','dmg','shed','alert','tRes','mp','score','spread','innateSelf'].forEach(k=>{if(f[k])F[k]*=f[k]});
    ['fit','cap','abDecay','fitCut','ep','bactDown'].forEach(k=>{if(f[k])F[k]+=f[k]});
    ['abRes','extRes'].forEach(k=>{if(f[k])F[k]=1-(1-F[k])*(1-f[k])});
    if(f.ifnRes)F.ifnRes=1-(1-F.ifnRes)*(1-f.ifnRes);
    if(f.drain)F.drainAdd+=f.drain;
    if(f.special)F.sp[f.special]=true;
  });
  if(F.sp.noPenalty)for(const k in F.rec)if(F.rec[k]<1)F.rec[k]=1;
  F.fit=Math.max(0,Math.round(F.fit*(1-F.fitCut)));
  return F;
}
let F=null;
const has=id=>P.nodes.includes(id);
const epUsed=()=>P.nodes.reduce((a,i)=>a+(N(i)?N(i).cost:0),0);
const epMax=()=>P.epBase+(F?F.ep:0);
const epLeft=()=>epMax()-epUsed();
/* 인접 규칙: 이미 찍은 노드와 붙어 있어야 한다 */
const reachable=id=>id==='core'||has('core')&&NEI[id].some(n=>has(n));
const recMul=id=>(F.rec[id]||1)*F.recAll;
const unlocked=id=>{
  const c=COMPS.find(x=>x.id===id);if(c.entry)return true;
  const need=ALLN.filter(n=>n.unlock&&n.unlock.includes(id));
  return need.length? need.some(n=>has(n.id)) : true;
};
const openC=id=>S.comp[id]>0||(unlocked(id)&&ADJ[id].some(a=>S.comp[a]>=20));

const load=()=>COMPS.reduce((a,c)=>a+S.comp[c.id]*c.yld,0);
const loadLog=()=>Math.min(9,Math.log10(Math.max(1,load()*4000)));
const tDmg=()=>COMPS.reduce((a,c)=>a+S.dmg[c.id],0)/COMPS.length;
/* 어느 칸이 망가졌는지가 중요하다 — 코가 헐어도 사람은 안 죽지만 폐포와 중추는 다르다 */
const LETH={nasal:.15,phar:.22,bron:.65,alv:2.3,blood:1.6,gut:.5,liver:1.35,cns:2.7};
const lethal=()=>COMPS.reduce((a,c)=>a+S.dmg[c.id]*(LETH[c.id]||.5),0)/COMPS.length;
/* 치명 장기가 한계를 넘으면 무너지는 속도가 붙는다 — 여기서부터 숙주는 급격히 꺼진다 */
const FAIL=[['alv',70,30,3.2,'호흡부전'],['cns',55,45,3.8,'뇌염'],
            ['blood',65,35,2.4,'파종성 혈관내 응고'],['liver',75,25,1.9,'간부전']];
const organFail=()=>FAIL.reduce((a,[k,th,sp,w])=>
  a+(S.dmg[k]>th? Math.min(1,(S.dmg[k]-th)/sp)*w : 0),0);
const temp=()=>Math.min(41.6,36.6+(S.innate/100)*3.2+(tDmg()/100)*2.6+(S.treat&&E().cure==='bleed'?-.3:0));
const spo2=()=>Math.max(70,Math.round(99-(S.comp.alv/100)*(S.dmg.alv/100)*34-(S.comp.bron/100)*3));
const tempF=()=>{const t=temp();return t<37.5?1:t<39?.86:t<40.5?.72:.56};
function yieldF(){
  const I=(S.innate/100)*.65*(1-F.ifnRes);
  const A=(S.ab/100)*(1-F.abRes)*F.tRes;
  let med=1;if(S.treat)med=E().cure==='antiviral'?.35:E().cure==='serum'?.62:1.08;
  if(S.treat&&F.sp.chronic)med=Math.min(1,med+.3);
  if(S.treat&&F.sp.latent)med=Math.min(1,med+.5);
  if(S.treat&&F.sp.fatal)med=1;
  if(S.shiftT>0)med*=.6;
  let eco=1;
  if(F.sp.symBact)eco*=1+S.bact/100*.3;
  if(F.sp.symFung&&S.fung>0)eco*=(S.treat?1.1:1.3);
  if(F.sp.ecosystem)eco*=1+Math.min(.4,(S.bact+S.fung)/200*.4);
  const floraRes=1-(S.flora/100)*.18;   // 상재균이 많을수록 복제가 눌린다
  return Math.max(0,F.yld*eco*floraRes*(1-I)*(1-A*.8)*(1-F.fit/100)*tempF()*med*(S.dorm?.1:1)*S.careMul);
}
function symptoms(){
  const o=[];
  if(S.comp.nasal>30)o.push(['콧물·코막힘',0]);
  if(S.comp.phar>40)o.push(['인후통',0]);
  if(S.comp.bron>40)o.push(['기침·객담',0]);
  if(S.comp.gut>35)o.push(['설사·구토',1]);
  if(temp()>=38)o.push(['발열 '+temp().toFixed(1)+'℃',1]);
  if(temp()>=39.3)o.push(['고열·근육통',1]);
  if(S.comp.liver>30)o.push(['황달',1]);
  if(spo2()<94)o.push(['호흡곤란 '+spo2()+'%',2]);
  if(S.comp.alv>70&&S.dmg.alv>50)o.push(['중증 폐렴',2]);
  if(S.comp.cns>10)o.push(['의식저하·경련',2]);
  if(S.comp.blood>35)o.push(['바이러스혈증',2]);
  return o;
}
function severity(){
  if(S.icu||spo2()<88||S.comp.cns>10)return 4;
  if(S.admit||spo2()<92||(S.comp.alv>70&&S.dmg.alv>50))return 3;
  if(temp()>=38.5||S.dx>=3||S.comp.liver>30)return 2;
  if(symptoms().length>0)return 1;
  return 0;
}
const SEVNM=['무증상','경증','중등증','중증','위중'];

function careRoll(){
  S.careMul=1;S.warn=null;
  const sv=severity();
  S.resolve=Math.min(100,S.resolve+sv*5+(symptoms().length?3:0)+(S.dx>1?4:0)-(sv===0?4:0));
  if(S.resolve<25||Math.random()>S.resolve/150)return;
  const pool=CARE.filter(c=>c.era<=P.era);
  const c=pool[Math.floor(Math.random()*pool.length)];
  S.innate=Math.min(100,S.innate+c.innate);
  S.host=Math.min(S.maxHost,S.host+c.host);
  S.careMul=c.y;
  if(c.alert)S.alert=Math.min(100,S.alert+c.alert);
  if(c.shed)S.careShed=c.shed;
  if(c.comp)S.dmg[c.comp]=Math.max(0,S.dmg[c.comp]-6);
  S.warn={ic:c.ic,t:c.t,e:c.e,innate:c.innate};
  S.resolve=Math.max(0,S.resolve-18);
  say('[경고] 숙주: '+c.t+' — 면역 +'+c.innate,'bad');
}

/* ═══ 미생물 생태: 상재균·기회감염 세균·진균 ═══ */
function microbes(){
  const dmg=tDmg(), abx=(E().dxMax>=4&&S.treat);      // 근대 이후 치료엔 항생제가 섞인다
  // 상재균(정상세균총)
  S.flora=Math.max(0,Math.min(100,S.flora
    - dmg*.05 - (abx?9:0) - (F.sp.antiBact?6:0) + (S.host>70?1.4:0.4)));
  // 기회감염 세균
  const bactRoom=(100-S.flora)/100;
  let bg=0;
  if(dmg>28||abx)bg=(dmg/100)*3.2*bactRoom+(abx?2.2:0);
  if(S.admit)bg+=1.4;                                  // 원내 감염
  S.bact=Math.max(0,Math.min(100,S.bact+bg-(F.sp.antiBact?6:0)-F.bactDown-(S.treat&&E().dxMax>=6?2.5:0)));
  // 진균
  const immLow=(S.innate<25)||(S.treat&&E().cure==='antiviral'&&S.icu)||F.ifnRes>.5;
  let fg=0;
  if(immLow&&S.flora<55)fg=1.6+(S.icu?1.2:0);
  S.fung=Math.max(0,Math.min(100,S.fung+fg-(E().dxMax>=6&&S.treat?2:0)-(F.sp.antiBact?1:0)));
  // 숙주에 가해지는 영향
  const hit=(S.bact/100)*1.5+(S.fung/100)*1.1;
  S.host=Math.max(0,S.host-hit*(F.sp.symBact||F.sp.ecosystem?1.3:1));
  S.alert=Math.min(100,S.alert+(S.bact>35?3:0)+(S.fung>25?2:0)
    -(F.sp.symBact?S.bact/100*3:0)-(F.sp.ecosystem?4:0));
  // 알림
  if(S.bact>=30&&!S.seenB){S.seenB=true;say('기회감염 세균 증식 — 숙주가 급격히 나빠진다','bad')}
  if(S.fung>=20&&!S.seenF){S.seenF=true;say('진균 집락 형성 — 면역이 비어 있다','bad')}
  if(S.flora<40&&!S.seenFl){S.seenFl=true;say('정상세균총 붕괴 — 점막이 비었다','hi')}
}

/* ═══ 병명: 트리와 상태로 조합된다 ═══ */
function diseaseName(){
  const occ=COMPS.map(c=>[c.id,S.comp[c.id]]).sort((a,b)=>b[1]-a[1]);
  const top=occ[0][1]>0?occ[0][0]:'nasal';
  const organ={nasal:'상기도',phar:'인두',bron:'기관지',alv:'폐',blood:'전신',
    gut:'장관',liver:'간',cns:'중추신경'}[top];
  const form={nasal:'카타르',phar:'인두염',bron:'기관지염',alv:'폐렴',blood:'패혈증',
    gut:'장염',liver:'간염',cns:'뇌염'}[top];
  const mods=[];
  if(has('latent'))mods.push('잠복성');
  if(has('chronic')||has('ntcp'))mods.push('만성');
  if(has('aero')||has('super')||has('keyC'))mods.push('유행성');
  if(has('presym'))mods.push('불현성');
  if(has('vasc'))mods.push('출혈성');
  if(has('cytok')||has('inflam'))mods.push('염증성');
  if(has('neuro')||has('bbb'))mods.push('신경친화성');
  if(has('bile'))mods.push('장관친화성');
  if(has('biofilm')||has('mycoflex')||has('keyG'))mods.push('혼합감염성');
  if(S.bact>35)mods.push('세균합병');
  if(S.fung>25)mods.push('진균합병');
  const sev=['','','급성','중증','전격성'][severity()];
  if(sev)mods.unshift(sev);
  const name=(mods.slice(0,3).join(' ')+' '+organ+' '+form).trim();
  return name;
}
function nameTick(){
  const n=diseaseName();
  if(n!==S.dname){
    const old=S.dname;S.dname=n;
    if(old&&S.day>0){say('병명이 바뀌었다 — '+n,'hi');S.nameChanged=n}
  }
  // 후대의 공식 명명
  if(!P.formal&&(P.total>=10||P.era>=2)){
    const greek=['알파','베타','감마','델타','엡실론'][Math.min(4,P.deaths)];
    P.formal='VRX-'+(P.hostIdx+1)+' '+greek+' 계통';
    say('후대가 이름을 붙였다 — '+P.formal,'hi');
  }
}

function checkTrigs(){
  TRIGS.forEach(t=>{
    if(P.trig.includes(t.id))return;
    let ok=false;try{ok=t.f()}catch(e){}
    if(ok){P.trig.push(t.id);P.epBase+=2;say('[트리거] '+t.nm+' — 진화점수 +2','hi');S.newTrig=t.nm}
  });
}
const trigOK=id=>!id||P.trig.includes(id);

/* ═══ 행동 ═══ */
function act(k){
  if(S.ap<=0||S.over)return;const c=COMPS.find(x=>x.id===sel);
  if(k==='inv'){
    if(S.comp[sel]>0||!openC(sel))return;
    if(S.mp<60)return say('에너지 부족','bad');
    S.mp-=60;S.ap--;
    const p=.42*c.rec*recMul(sel)*F.inv*(1-S.ab/160*(1-F.abRes));
    if(Math.random()<p){S.comp[sel]=5;say(c.nm+' 침투 성공','hi');
      if(sel==='cns'){S.icu=true;say('중추신경 침습 — 최고 등급 치료','bad')}}
    else say(c.nm+' 침투 실패 — 입자 소실');
    seedParts();
  }
  if(k==='burst'){
    if(S.comp[sel]<=0)return;if(S.mp<45)return say('에너지 부족','bad');
    S.mp-=45;S.ap--;
    S.comp[sel]=Math.min(100,S.comp[sel]+10*yieldF()*recMul(sel)*F.spread+3);
    S.dmg[sel]=Math.min(100,S.dmg[sel]+6*c.dmg*F.dmg);
    S.alert+=6*F.alert;say(c.nm+' 집중 복제');seedParts();
  }
  if(k==='hide'){if(S.mp<25)return say('에너지 부족','bad');
    S.mp-=25;S.ap--;S.alert=Math.max(0,S.alert-14);S.innate=Math.max(0,S.innate-6);say('발현 억제')}
  if(k==='mut'){
    if(S.ap<2)return say('변이에는 AP 2 필요');
    if(F.sp.nomut)return say('대형 게놈은 항원 변이가 불가능하다','bad');
    if(S.mp<90)return say('에너지 부족','bad');
    S.mp-=90;S.ap=0;
    let pr=.7+(F.sp.fastPol?.2:0)-(F.sp.proof?.42:0);
    if(Math.random()<pr){S.ab=Math.max(0,S.ab-45);S.treat=false;S.mutOK++;say('변이 성공 — 항체 회피','hi')}
    else say('변이 실패 — 결손 입자','bad');
  }
  if(k==='dorm'){if(S.ap<2)return;S.ap=0;S.dorm=true;say('잠복 전환')}
  if(k==='shift'){
    if(!has('shift'))return;if(S.shiftUsed)return say('항원 대변이는 1회만 가능','bad');
    if(S.ap<2)return say('AP 2 필요');S.ap=0;S.shiftUsed=true;S.shiftT=3;
    P.herd=0;S.ab=0;S.adaptive=0;say('항원 대변이 — 인류 축적 면역 전부 무효화','hi');
  }
  render();if(TUT.on)tutCheck(k);
}

/* ═══ 턴 ═══ */
function endTurn(){
  if(S.over)return;
  S.half++;if(S.half>1){S.half=0;S.day++}
  const wasDorm=S.dorm;S.dorm=false;if(wasDorm)S.dormT++;
  if(S.shiftT>0)S.shiftT--;
  careRoll();
  const y=yieldF();
  COMPS.forEach(c=>{if(S.comp[c.id]<=0)return;
    S.comp[c.id]=Math.min(100,S.comp[c.id]+5.5*y*c.rec*recMul(c.id)*F.spread*(1-S.comp[c.id]/100));
    S.dmg[c.id]=Math.min(100,S.dmg[c.id]+(S.comp[c.id]/100)*1.6*c.dmg*F.dmg)});
  let inc=0;COMPS.forEach(c=>inc+=(S.comp[c.id]/100)*c.yld*22);
  S.mp=Math.round(S.mp+inc*F.mp*(S.host/S.maxHost)-14);
  const drain=1+F.drainAdd;
  /* 손상이 실제로 숙주를 깎는다: 칸마다 치명도가 다르고, 장기가 무너지면 가속한다 */
  S.host=Math.max(0,S.host-(lethal()*.085+organFail()+(spo2()<90?1.6:0))*drain
    -(S.treat&&E().cure==='bleed'?.9:0));
  /* 장기가 한계를 넘는 순간은 플레이어가 알아야 한다 */
  S.failSeen=S.failSeen||{};
  FAIL.forEach(([k,th,,,nm])=>{if(S.dmg[k]>th&&!S.failSeen[k]){S.failSeen[k]=1;
    say('['+COMPS.find(c=>c.id===k).nm+'] '+nm+' — 숙주가 빠르게 무너진다','bad')}});
  S.innate=Math.min(100,S.innate+loadLog()*1.6*(1-F.ifnRes)*F.innateSelf);
  if(S.day>=3)S.adaptive=Math.min(100,S.adaptive+5.5);
  if(S.adaptive>45)S.ab=Math.min(100,S.ab+4.5);
  S.ab=Math.max(0,S.ab-F.abDecay);
  if(S.ab>0)COMPS.forEach(c=>{if(S.comp[c.id]>0)
    S.comp[c.id]=Math.max(0,S.comp[c.id]-(S.ab/100)*3.4*(1-F.abRes)*F.tRes*(c.id==='cns'?.5:1))});
  microbes();
  S.alert=Math.min(100,S.alert+(tDmg()*.22+(temp()>=38?3:0)+(spo2()<94?6:0))*F.alert);
  const need=[0,6,22,38,54,70,86];
  while(S.dx<E().dxMax&&S.alert>=need[S.dx]){S.dx++;say('진단 '+S.dx+'단계 — '+DXNAME[S.dx],'hi');
    if(S.dx===E().dxMax)S.evQ.push([MEDIMG[P.era]||'doc','진단 한계 도달',DXNAME[S.dx]+'까지 왔다',
      '"이제 그들은 당신이 무엇인지 안다."','이 시대가 할 수 있는 최고 단계'])}
  if(E().cure&&!S.treat&&S.dx>=Math.max(1,E().dxMax-1)){S.treat=true;
    say({bleed:'사혈·약초 처방 — 숙주가 더 약해진다',serum:'혈청 요법 — 복제 수율 저하',
      antiviral:'항바이러스제 — 복제 수율 급감'}[E().cure],E().cure==='bleed'?'hi':'bad');
    S.evQ.push([MEDIMG[P.era]||'doctor','치료 개입',MEDTXT[P.era][0],MEDTXT[P.era][1],MEDTXT[P.era][2]])}
  if(E().dxMax>=4&&spo2()<92&&!S.admit){S.admit=true;say('입원 — 산소 요법','bad')}
  if(E().dxMax>=6&&(S.host<25||spo2()<88)&&!S.icu){S.icu=true;say('중환자실 이송','bad')}
  if(E().quar>0&&S.dx>=E().dxMax&&!S.quar){S.quar=true;say('격리·검역','bad');
    S.evQ.push(['quar','격리','문이 닫혔다','"나갈 길이 막혔다."',
      '전파 효율 ×'+E().quar.toFixed(2)])}
  if(severity()===0)S.stealth++;else S.stealth=0;

  let route=(S.comp.nasal+S.comp.phar+S.comp.bron)/300*.9;
  for(const k in F.route)route+=(S.comp[k]/100)*F.route[k];
  route*=F.shed*(S.careShed||1)*E().contact*(S.quar?(F.sp.vector?Math.min(1,E().quar*2):E().quar):1)
        *(S.admit?.3:1)*(F.sp.latent&&wasDorm?0:1);
  S.careShed=1;
  const tries=F.sp.double?2:1;
  for(let i=0;i<tries;i++)
    if(route>0&&Math.random()<Math.min(.65,route*.3)){S.sec++;P.total++;say('2차 감염 +1 — 누적 '+S.sec+'명','hi');
      if(S.sec===1)S.evQ.push(['spread','전파 성공','당신은 이 몸을 넘어갔다',
        '"그 사람과 스쳤을 뿐이다."','누적 2차 감염 '+P.total+'명'])}

  checkTrigs();nameTick();
  const sv=severity();
  if(S.evQ.length){const q=S.evQ.shift();showEvt(IMG[q[0]],E().nm+' · D'+S.day+' · '+q[1],q[2],q[3],q[4]);S.sev=sv}
  else if(sv>S.sev){S.sev=sv;S.peak=Math.max(S.peak,sv);showScene(sv,false)}
  else if(sv<S.sev&&S.peak>=2){S.sev=sv;showScene(sv,true)}
  else S.sev=sv;

  if(load()<1&&!F.sp.latent)finish('박멸','검출 한계 아래로 떨어졌다.');
  else if(S.host<=0){P.deaths++;finish(S.sec>0?'숙주 사망 · 전파 성공':'숙주 사망 · 막다른 길',
    S.sec>0?'숙주는 죽었지만 '+S.sec+'명에게 넘어갔다.':'숙주와 함께 끝났다. 아무에게도 가지 못했다.')}
  else if(S.day>=16&&S.ab>70)finish(S.sec>0?'완치 · 전파 성공':'완치 · 박멸',
    F.sp.latent?'겉으로는 나았다. 당신은 신경절에 남아 있다.':'중화항체가 자리잡았다.');
  S.ap=2;seedParts();render();if(TUT.on)tutCheck('next');
  if(typeof saveGame==='function')saveGame();   // 턴이 끝날 때마다 담아 둔다
}
function finish(t,b){S.over={t,b,next:S.sec>0&&P.hostIdx<HOSTS.length-1};
  P.herd+=S.sec*6+8;say('── '+t,'hi');showEnd();
  /* 더 갈 데가 없으면 기록을 지운다 — 끝난 판으로 되돌아가지 않게 */
  if(typeof saveGame==='function'){S.over.next?saveGame():(typeof wipeSave==='function'&&wipeSave())}}
function nextHost(){P.hostIdx++;newHost();document.getElementById('ev').classList.remove('on');
  seedParts();render();showBrief();if(typeof saveGame==='function')saveGame()}

/* ═══ 캔버스 ═══ */
const cv=document.getElementById('body'),cx=cv.getContext('2d');
let W=0,H=0,DPR=1,parts=[],hit=[],imgs={};
const LABR=['nasal','bron','blood','liver'];  // 오른쪽 라벨, 나머지 왼쪽
['body','virion','imac','inet','itc','figure','figureF','figureOld','bgtissue'].concat(['ln_A', 'ln_B', 'ln_C', 'ln_D', 'ln_E', 'ln_F', 'ln_G']).concat(['org_cns', 'org_liver', 'org_gut', 'org_blood', 'org_alv', 'org_bron', 'org_phar', 'org_nasal']).forEach(k=>{const i=new Image();i.src=IMG[k];imgs[k]=i});
function fitCanvas(){const r=cv.parentElement.getBoundingClientRect();
 DPR=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
function geo(){const s=Math.min(W/300,H/400),ox=W/2,oy=(H-400*s)/2+6;
 return{s,T:(x,y)=>[ox+(x-150)*s,oy+(y-14)*s]}}
function drawBody(){
  cx.clearRect(0,0,W,H);const g=geo(),s=g.s,T=g.T;hit=[];
  if(imgs.body.complete&&imgs.body.naturalWidth){
    const bh=400*s,bw=bh*(560/840),bx=W/2-bw/2,by=T(150,14)[1]-bh*.012;
    cx.globalAlpha=.92;cx.drawImage(imgs.body,bx,by,bw,bh);cx.globalAlpha=1}
  COMPS.forEach(c=>{
    const occ=S.comp[c.id],dm=S.dmg[c.id],p=T(c.xy[0],c.xy[1]),r=c.r*s;
    hit.push({id:c.id,p,r:Math.max(r,24*s)});
    const on=occ>0,op=openC(c.id);
    if(on){const gr=cx.createRadialGradient(p[0],p[1],0,p[0],p[1],r);
      gr.addColorStop(0,'rgba(63,224,173,'+(.18+occ/100*.5)+')');gr.addColorStop(1,'rgba(63,224,173,0)');
      cx.fillStyle=gr;cx.beginPath();cx.arc(p[0],p[1],r,0,7);cx.fill();
      if(dm>25){const g2=cx.createRadialGradient(p[0],p[1],0,p[0],p[1],r);
        g2.addColorStop(0,'rgba(226,85,74,'+(dm/100*.42)+')');g2.addColorStop(1,'rgba(226,85,74,0)');
        cx.fillStyle=g2;cx.beginPath();cx.arc(p[0],p[1],r,0,7);cx.fill()}}
    cx.beginPath();cx.arc(p[0],p[1],r*.62,0,7);

 COMPS.forEach(c=>{const n=Math.min(10,Math.round(S.comp[c.id]/10)),p=g.T(c.xy[0],c.xy[1]),r=c.r*g.s*.8;

   parts.push({x:p[0]+Math.cos(a)*d,y:p[1]+Math.sin(a)*d,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,

function pickAt(x,y){
  if(typeof GL!=='undefined'&&GL.ready){const g=glPick(x,y,W,H);if(g)return g}
  let best=null,bd=1e9;
  hit.forEach(h=>{
    let d=Math.hypot(h.p[0]-x,h.p[1]-y);
    if(h.lab&&x>=h.lab.x&&x<=h.lab.x+h.lab.w&&y>=h.lab.y&&y<=h.lab.y+h.lab.h)d=0;  // 라벨 직접 터치
    if(d>h.r*1.6)return;

    if(sc<bd){bd=sc;best=h.id}});
  return best;
}

  if(!tctx)return;

  // 연결선
  GE.forEach(([a,b])=>{
    const A=N(a),B=N(b),live=has(a)&&has(b),half=has(a)||has(b);
    tctx.beginPath();tctx.moveTo(A.x,A.y);tctx.lineTo(B.x,B.y);
    tctx.strokeStyle=live?LINECOL[A.line==='·'?B.line:A.line]:(half?'rgba(140,160,152,.5)':'rgba(70,86,80,.45)');
    tctx.lineWidth=live?3.2:1.6;tctx.stroke();
  });

  ALLN.forEach(n=>{
    const st=nodeState(n),col=LINECOL[n.line]||'#cfe0d8',r=RAD[n.kind];
    tctx.beginPath();
    if(n.kind==='notable'||n.kind==='key'||n.kind==='core'){
      const k=n.kind==='minor'?4:(n.kind==='key'?6:(n.kind==='core'?8:5));
      for(let i=0;i<k;i++){const a=-Math.PI/2+i*2*Math.PI/k;
        const px=n.x+Math.cos(a)*r,py=n.y+Math.sin(a)*r;i?tctx.lineTo(px,py):tctx.moveTo(px,py)}
      tctx.closePath();

    tctx.fill();

    tctx.lineWidth=st==='own'?2.6:(st==='ok'?2:1.3);
    tctx.setLineDash(st==='lock'?[4,3]:[]);tctx.stroke();tctx.setLineDash([]);

  tctx.restore();
}

function toggleNode(id){

    if(n.kind==='core')return;
    // 해제하면 끊기는 노드가 있으면 막는다
    const rest=P.nodes.filter(x=>x!==id);
    const seen=new Set(['core']),q=['core'];
    while(q.length){const c=q.pop();NEI[c].forEach(k=>{if(rest.includes(k)&&!seen.has(k)){seen.add(k);q.push(k)}})}
    if(rest.some(x=>!seen.has(x)))return say('이 노드를 빼면 바깥 노드가 끊긴다','bad');
    P.nodes=rest;say(n.nm+' 해제');

/* ═══ 사장님 그림을 진짜 입체로 ═══
   그림의 밝기를 높이로 읽어 앞뒤로 솟아오르게 한다(변위 매핑).
   표면은 원본 그림 그대로. 돌리면 두께와 실루엣이 실제로 바뀐다. */
/* 모델마다 정면이 달라 돌려 맞춘다 */
const ORGROT={cns:[0,Math.PI/2,0]};
const GL={ready:false,T:null,r:null,sc:null,cam:null,organs:{},glow:{},fig:null,figKey:'',pts:null,ray:null,dist:700,tex:{},bodies:{},body3:null,bodyKey:''};
